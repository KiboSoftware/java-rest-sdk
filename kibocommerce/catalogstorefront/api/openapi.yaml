openapi: 3.0.1
info:
  description: |-
    <div id="overview_CATALOG_STOREFRONT">
                <h2>CATALOG STOREFRONT</h2>
                <p>The Catalog Storefront APIs are a collection of resources for managing storefront categories, currencies, price lists, products, and
                    product search. This controls how the products in your catalog are organized and displayed on the
                    storefront. See the
                    <a href="/concept-guides/catalog">Catalog user guides</a>
                    for information about the related features in the Unified Commerce Admin.</p>
                <p>Use the <strong>Currencies</strong> resource to retrieve exchange rates for displaying prices on your storefront.</p>
                <p>Use the <strong>Storefront Categories</strong> resource to view the product category hierarchy as it appears to shoppers
                    who are browsing the storefront. The hierarchy can be returned as a flat list or as a category tree.</p>
                <p>Use the <strong>Pricelists</strong> resource to retrieve the details of a price list. The details may contain a hierarchy
                    of ancestor and/or descendant price lists dependening on your configuration.</p>
                <p>Use the <strong>Storefront Products</strong> resource to manage the shopper product selection process during a visit to
                    the web storefront. You can update product options as shoppers pick and choose their product choices. A
                    shopper cannot add a product to a cart until all of its required options have been selected.</p>
                <p>Use the <strong>Product Search</strong> resource to provide dynamic search results to shoppers as they browse and search
                    for products on the web storefront, and to suggest possible search terms as the shopper enters text. The related <strong>Search Redirect</strong>
                    resource allows you to retrieve any search redirect items.</p>
            </div>
  title: Kibo Catalog Runtime Services
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /commerce/catalog/storefront/campaigns/all:
    get:
      description: Get list of Search campaigns.
      operationId: getCampaigns
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CampaignResult'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CampaignResult'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CampaignResult'
                type: array
          description: OK
      summary: Get Search Campaigns
      tags:
      - Campaigns
      x-accepts: application/json
  /commerce/catalog/storefront/campaigns/{campaignId}:
    get:
      description: Get a specific campaign by campaign id.
      operationId: getCampaign
      parameters:
      - description: ""
        explode: false
        in: path
        name: campaignId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResult'
            text/json:
              schema:
                $ref: '#/components/schemas/CampaignResult'
            text/plain:
              schema:
                $ref: '#/components/schemas/CampaignResult'
          description: OK
      summary: Get Search Campaign
      tags:
      - Campaigns
      x-accepts: application/json
  /commerce/catalog/storefront/categories:
    get:
      description: Retrieves a list of product categories that appear on the storefront
        as a flat list. Hidden categories do not appear in the list.
      operationId: storefrontGetCategories
      parameters:
      - description: |-
          Optional. A set of filter expressions representing the search parameters for a query:
                      eq=equals, ne=not equals, gt=greater than, lt = less than, gt = greater than or equals, le = less than or equals,
                      sw = starts with, or cont = contains.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: |-
          Optional. Used to page results from a query.
                      Indicates the zero-based offset in the complete result set where the returned entities begin.
                      For example, with a pageSize of 25, to get the 51st through the 75th items, startIndex=3.
                      The default value is 0.
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: |-
          Optional. Used to page results from a query.
                      Indicates the maximum number of entities to return from a query. Default value: 20. Maximum value: 200.
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: |-
          The element to sort the results by and the order in which the results appear.
                      Either ascending order (a-z) which accepts 'asc' or 'ASC' or descending order (z-a) which accepts 'desc' or 'DESC'.
                      The sortBy parameter follows an available property.
                      For example, to sort results by category ID ascending, use sortBy=categoryId asc.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Used to include Category Attributes in response
        explode: true
        in: query
        name: includeAttributes
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryPagedCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryPagedCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryPagedCollection'
          description: OK
      summary: Get Product Categories
      tags:
      - Categories
      x-accepts: application/json
  /commerce/catalog/storefront/categories/tree:
    get:
      description: Retrieves the list of product categories that appear on the storefront
        organized in a hierarchical format. Hidden categories do not appear in the
        list.
      operationId: storefrontGetCategoryTree
      parameters:
      - description: "Optional. If True, Return Category Attributes collection with\
          \ Category"
        explode: true
        in: query
        name: includeAttributes
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategoryCollection'
          description: OK
      summary: Get Category Tree
      tags:
      - Categories
      x-accepts: application/json
  /commerce/catalog/storefront/categories/{categoryId}:
    get:
      description: 'Retrieves the name and details of a category that appears on the
        storefront. '
      operationId: storefrontGetCategory
      parameters:
      - description: Required. Unique identifier of the category whose details you
          want to get.
        explode: false
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: Optional. Allow the return of items with the IsDisplayed flag
          set to false.
        explode: true
        in: query
        name: allowInactive
        required: false
        schema:
          type: boolean
        style: form
      - description: "Optional. If True, Return Category Attributes collection with\
          \ Category"
        explode: true
        in: query
        name: includeAttributes
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategory'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategory'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesCategory'
          description: OK
      summary: Get Product Category
      tags:
      - Categories
      x-accepts: application/json
  /commerce/catalog/storefront/currencies/exchangerates:
    get:
      description: Retrieves a list of currency exchange rates based on the context's
        currency code.
      operationId: storefrontGetCurrencyExchangeRates
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/CatalogRuntimesCurrencyExchangeRate'
                type: array
          description: OK
      summary: Get Exchange Rates
      tags:
      - Currencies
      x-accepts: application/json
  /commerce/catalog/storefront/pricelists/resolved:
    get:
      description: This is primarily used when creating an offline order for a shopper.
        You can use this operation alongside custom Arc.js actions to alter the price
        list to which a shopper resolves.
      operationId: storefrontGetResolvedPriceList
      parameters:
      - explode: true
        in: query
        name: customerAccountId
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/plain:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
          description: OK
      summary: Get Resolved Price List (GET)
      tags:
      - StorefrontPriceLists
      x-accepts: application/json
    post:
      description: This is primarily used when creating an offline order for a shopper.
        You can use this operation alongside custom Arc.js actions to alter the price
        list to which a shopper resolves.
      operationId: storefrontGetResolvedPriceList2
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/json:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
            text/plain:
              schema:
                $ref: '#/components/schemas/ResolvedPriceList'
          description: OK
      summary: Get Resolved Price List (POST)
      tags:
      - StorefrontPriceLists
      x-content-type: application/json
      x-accepts: application/json
  /commerce/catalog/storefront/pricelists/{priceListCode}:
    get:
      description: Retrieves the price list for the given priceListCode
      operationId: storefrontGetPriceList
      parameters:
      - explode: false
        in: path
        name: priceListCode
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesPriceList'
          description: OK
      summary: Get Price List
      tags:
      - StorefrontPriceLists
      x-accepts: application/json
  /commerce/catalog/storefront/products:
    get:
      description: Retrieves a list of products that appear on the storefront according
        to any specified filter criteria and sort options.
      operationId: storefrontGetProducts
      parameters:
      - description: "Optional. A set of filter expressions representing the search\
          \ parameters for a query: eq=equals, ne=not equals, gt=greater than, lt\
          \ = less than, gt = greater than or equals, le = less than or equals, sw\
          \ = starts with, or cont = contains."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: "Used to page results from a query. Indicates the zero-based\
          \ offset in the complete result set where the returned entities begin. For\
          \ example, with a pageSize of 25, to get the 51st through the 75th items,\
          \ startIndex=3. Default value: 0."
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Used to page results from a query. Indicates the maximum number\
          \ of entities to return from a single query. Default value: 20. Maximum\
          \ value: 200."
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: "Optional. Sort the results by and the order in which the results\
          \ appear. Either ascending order (a-z) which accepts 'asc' or 'ASC' or descending\
          \ order (z-a) which accepts 'desc' or 'DESC'. The sortBy parameter follows\
          \ an available property. For example, to sort the results by “ID” ascending\
          \ then by “CreateDate” descending, use: id asc,createdate desc."
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Response groups to be determined.
        explode: true
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
        style: form
      - description: ""
        explode: true
        in: query
        name: responseOptions
        required: false
        schema:
          type: string
        style: form
      - description: Pass in * to begin a deep page operation. The response will include
          a nextCursorMark value. Pass this into the next call. Continue with this
          pattern until nextCursorMark is null.
        explode: true
        in: query
        name: cursorMark
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: defaultSort
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: mid
        required: false
        schema:
          type: string
        style: form
      - description: Optional. If true return all images instead of default images.
        explode: true
        in: query
        name: includeAllImages
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: useSubscriptionPricing
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: includeProductDetailsOnlyProperty
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: collapse
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: customerSegments
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProductCollection'
          description: OK
      summary: Get Products
      tags:
      - StorefrontProducts
      x-accepts: application/json
  /commerce/catalog/storefront/products/costs:
    post:
      description: Get costs for products. This cost is the amount the merchant pays
        for the product—it is not the price that the shopper sees on the storefront
        (which is usually higher).
      operationId: storefrontGetProductCosts
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCostQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductCostCollection'
          description: OK
      summary: Get Product Costs
      tags:
      - StorefrontProducts
      x-content-type: application/json
      x-accepts: application/json
  /commerce/catalog/storefront/products/indexing/{productCode}:
    get:
      description: Retrieves information about a single product given its product
        code for Mozu to index in the search engine
      operationId: storefrontGetProductForIndexing
      parameters:
      - description: "Required. Merchant-created code associated with the product,\
          \ for example, a SKU. Max length: 30."
        explode: false
        in: path
        name: productCode
        required: true
        schema:
          type: string
        style: simple
      - description: Optional. Response groups to be determined.
        explode: true
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. The current version of the product to use for latency\
          \ checking. \n            \tIf this instance of Product Runtime is configured\
          \ to run against a replicated database node that has a lesser version than\
          \ this value, it will read from the primary database node to prevent stale\
          \ data."
        explode: true
        in: query
        name: productVersion
        required: false
        schema:
          format: int64
          type: integer
        style: form
      - explode: true
        in: query
        name: lastModifiedDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
            text/json:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProductForIndexing'
          description: OK
      summary: Get Product for Indexing
      tags:
      - StorefrontProducts
      x-accepts: application/json
  /commerce/catalog/storefront/products/locationinventory:
    post:
      description: Get location inventories for a list of products
      operationId: storefrontGetProductInventories
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationInventoryQuery'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/LocationInventoryCollection'
          description: OK
      summary: Get location inventories for a list of products
      tags:
      - StorefrontProducts
      x-content-type: application/json
      x-accepts: application/json
  /commerce/catalog/storefront/products/{productCode}:
    get:
      description: Retrieves information about a single product given its product
        code.
      operationId: storefrontGetProduct
      parameters:
      - description: "Required. Merchant-created code associated with the product,\
          \ for example, a SKU. Max length: 30."
        explode: false
        in: path
        name: productCode
        required: true
        schema:
          type: string
        style: simple
      - description: "Optional. Merchant-created code associated with a specific product\
          \ variation. Max length: #."
        explode: true
        in: query
        name: variationProductCode
        required: false
        schema:
          type: string
        style: form
      - description: Optional. Response groups to be determined.
        explode: true
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
        style: form
      - description: "Optional. If true, return a product if it is located but inactive."
        explode: true
        in: query
        name: allowInactive
        required: false
        schema:
          type: boolean
        style: form
      - description: Determines whether or not to check inventory on an item when
          validating
        explode: true
        in: query
        name: skipInventoryCheck
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "Optional. If true, will still return the product, even if product\
          \ is out of stock and the out of stock behavior is set to “Hide Product\
          \ in Store”. If false or omitted, the same product will return a 404 not\
          \ found. Suppressing the 404 not found is useful for site SEO."
        explode: true
        in: query
        name: supressOutOfStock404
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "Optional.  If specified, will be used for returning pricing\
          \ based on volume if applicable.  Defaults to 1 if not specified."
        explode: true
        in: query
        name: quantity
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: acceptVariantProductCode
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: purchaseLocation
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: variationProductCodeFilter
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: sliceValue
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: includeAllImages
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: useSubscriptionPricing
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: customerSegments
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
            text/json:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
            text/plain:
              schema:
                $ref: '#/components/schemas/CatalogRuntimesProduct'
          description: OK
      summary: Get Product
      tags:
      - StorefrontProducts
      x-accepts: application/json
  /commerce/catalog/storefront/products/{productCode}/configure:
    post:
      description: "Configure a new product selection. This occurs each time a shopper\
        \ selects a product option as they configure a product. Once all the required\
        \ product options are configured, the product can be added to a cart."
      operationId: storefrontConfigureProduct
      parameters:
      - description: "Merchant-created code for the product being configured, for\
          \ example, a SKU. Max length: 30."
        explode: false
        in: path
        name: productCode
        required: true
        schema:
          type: string
        style: simple
      - description: "If true, the response returns product details such as. If false,\
          \ returns a product summary such as the product name, price, and sale price."
        explode: true
        in: query
        name: includeOptionDetails
        required: false
        schema:
          type: boolean
        style: form
      - description: Determines whether or not to check inventory on an item when
          validating
        explode: true
        in: query
        name: skipInventoryCheck
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: "Optional.  If specified, will be used for returning pricing\
          \ based on volume if applicable.  Defaults to 1 if not specified."
        explode: true
        in: query
        name: quantity
        required: false
        schema:
