    DocumentListType:
      description: "A documentListType instructs the Mozu platform to automatically\
        \ create documentLists within a scopeType. Example: Creating a documentListType\
        \ in tenant X with a \nscopeType of site tells the Mozu platform to immediately\
        \ create a documentList in each site tenant X has. The Mozu platform will\
        \ also automatically create a new \ndocumentList for every site subsequently\
        \ provisioned in tenant X. Any defaultDocuments defined on the documentListType\
        \ will be created within \neach documentList. Each documentList will be addressable\
        \ via the documenetListType's fully qualified name and will, by default, use\
        \ the documentListType's views, \nusages and metadata. Therefore the documentListType\
        \ can be used to centrally manage each associated documentList."
      example:
        installationPackage: installationPackage
        metadata: ""
        enablePublishing: true
        defaultDocuments:
        - name: name
          documentTypeFQN: documentTypeFQN
          locale: locale
          properties: ""
        - name: name
          documentTypeFQN: documentTypeFQN
          locale: locale
          properties: ""
        supportsActiveDateRanges: true
        version: version
        supportsPublishing: true
        documentTypeFQNs:
        - documentTypeFQNs
        - documentTypeFQNs
        scopeType: scopeType
