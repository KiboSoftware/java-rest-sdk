    View:
      description: |-
        A view provides GET access to documents within the documentList the view belongs to. The view can designate which document fields are returned (projection) and
        a security model for providing GET access independent of the documentList's security model.
      example:
        filter: filter
        metadata: ""
        includeInactiveMode: includeInactiveMode
        isAdminDefault: true
        name: name
        usages:
        - usages
        - usages
        fields:
        - name: name
          target: target
        - name: name
          target: target
        isVisibleInStorefront: true
      properties:
        fields:
          description: Designation of which document fields are returned (projection)
            when GETing documents from the view.
          items:
            $ref: '#/components/schemas/ViewField'
          nullable: true
          type: array
        filter:
          description: "Filter criteria to apply automatically when documents from\
            \ this view are accessed, using the standard Mozu filter syntax. Only\
            \ documents matching the filter criteria will be returned. \nAny filter\
            \ provided by an operation is combined with the view filter."
          nullable: true
          type: string
        includeInactiveMode:
          description: |-
            If view documents are requested with includeInactive=true, then this controls which documents return. If includeInactive is not provided or set to false, then only active documents return.
            If not set, or set to "all", then all documents return.
            If set to "active", then only documents within the active date range and documents with no active date range are returned.
            If set to "scheduled", then only documents with an active date range in the future are returned.
            If set to "activeOrScheduled", then only documents that are active or documents with an active date range in the future are returned.
            If set to "ended", then only documents with an active date range in the past are returned.
          nullable: true
          type: string
        isAdminDefault:
          nullable: true
          type: boolean
        isVisibleInStorefront:
          description: "The isVisibleInStorefront field indicates whether documents\
            \ in the view can be accessed from the Mozu storefront application. If\
            \ true, the storefront application and storefront client application (javascript\
            \ tier) \ncan GET documents from the view."
          nullable: true
          type: boolean
        metadata:
          description: The metadata field allows arbitrary data to be stored on the
            view.
          nullable: true
        name:
          description: "A view is addressed via its name, which is unique within the\
            \ documentList or documentListType in which it is defined."
          nullable: true
          type: string
        usages:
          description: tbd
          items:
            type: string
          nullable: true
          type: array
      type: object
    ViewField:
      description: The projection of an individual field in a view.
      example:
        name: name
        target: target
      properties:
        name:
          description: |-
            The name of the field projected into the view document, meaning the name given to the target field after it is projected.
            The name must be unique within the list of viewFields provided in the view.
          nullable: true
          type: string
        target:
          description: "Specifies the document field to project. First-class fields\
            \ will be returned on the document, but can be projected into the view\
            \ properties. \nValid first-class fields include name, id, documentTypeFqn,\
            \ listFqn and publishState. Dynamic fields within the properties field\
            \ can be projected by prefixing the target string with \"properties.\"\
            \nExample: \"properties.property1\". If a property is an object, then\
            \ dot notation can be used to walk to particular subelements. Example:\
            \ \"properties.property1.subProperty1\"\nIndividual array elements can\
            \ be selected as well. Example: \"properties.property1.subProperty1.subSubArray[2].propertyOnArrayItem\"\
            \nAny target miss will result in a null value returning for the projected\
            \ field."
          nullable: true
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. \r\n\r\n Enter\
        \ 'Bearer' [space] and then your token in the text input below.\r\n\r\nExample:\
        \ \"Bearer 12345abcdef\""
      scheme: bearer
      type: http

