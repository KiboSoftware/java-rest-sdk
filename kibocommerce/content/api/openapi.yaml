openapi: 3.0.1
info:
  description: "<div id=\"overview_CONTENT\">\n            <h2>CONTENT</h2>\n    \
    \        <p>The Content APIs allow you to organize your site content into a hierarchy\
    \ of folders and documents, as\n                well as control the publishing\
    \ of your content to the live site with publish sets that group pending\n    \
    \            changes together to publish at the same time. For more information\
    \ about managing site content and the associated UI,\n                see the\
    \ <a href=\"/pages/site-builder\">Site Builder</a> and <a href=\"/pages/publishing\"\
    >Publishing</a> user guides.</p>\n            <p>Use the <strong>Document Lists</strong>\
    \ and <strong>Document List Types</strong> resources to organize your site's documents\
    \ into a hierarchy. Document lists can\n                contain documents, folders,\
    \ and complete hierarchies of folders, which contain documents with unique\n \
    \               names. The type denotes a content type for that list of folders,\
    \ sub-folders, and documents such as\n                `web_pages`.</p>\n     \
    \       <p>Use the <strong>Document Types</strong> and <strong>Document Property\
    \ Types</strong> resources to manage the document and property types supported\
    \ by the Content API.</p>\n            <p>Use the <strong>Document Publishing</strong>\
    \ resource to manage and publish document drafts. The \n                related\
    \ <strong>Document Publish Set</strong> resource manages publish sets and the\
    \ pending content drafts.</p>\n        </div>"
  title: Kibo Content Service
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /content/documentlistTypes:
    get:
      description: "Get Document List Types. The list type denotes a content type\
        \ for that list of folders, sub-folders, and documents. The immutable document\
        \ list types that are defined out-of-the-box are pages, siteSnippets, files,\
        \ siteSettings, catalogContent, pageTemplateContent, emailTemplateContent,\
        \ and entityEditors."
      operationId: getDocumentListTypes
      parameters:
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListTypeCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentListTypeCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentListTypeCollection'
          description: OK
      summary: Get Document List Types
      tags:
      - DocumentListType
      x-accepts: application/json
    post:
      description: "Create Document List Type. Creating a new documentListType will\
        \ tell the Content service to immediately create a document list of the new\
        \ type within the set scopeType. For instance, a scopeType of \"site\" will\
        \ create a list in each site for the tenant. Any defaultDocuments defined\
        \ for the type will be created within each list, which will be addressable\
        \ via the type's fully qualified name (FQN) and will use the type's defined\
        \ views, usages, and metadata by default."
      operationId: createDocumentListType
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListType'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DocumentListType'
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentListType'
        description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentListType'
          description: OK
      summary: Create Document List Type
      tags:
      - DocumentListType
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlistTypes/{documentListTypeFQN}:
    get:
      description: Get Document List Type
      operationId: getDocumentListType
      parameters:
      - explode: false
        in: path
        name: documentListTypeFQN
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentListType'
          description: OK
      summary: Get Document List Type
      tags:
      - DocumentListType
      x-accepts: application/json
    put:
      description: Update Document List Type
      operationId: updateDocumentListType
      parameters:
      - description: The name of the document documentListName to update
        explode: false
        in: path
        name: documentListTypeFQN
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentListType'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DocumentListType'
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentListType'
        description: Content Collection values to apply
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentListType'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentListType'
          description: OK
      summary: Update Document List Type
      tags:
      - DocumentListType
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists:
    get:
      description: Retrieve a paged documentListName of all document lists
      operationId: getDocumentLists
      parameters:
      - description: maximum number of items to return
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentListCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentListCollection'
          description: OK
      summary: Get Document Lists
      tags:
      - DocumentList
      x-accepts: application/json
    post:
      description: Create DocumentList
      operationId: createDocumentList
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentList'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DocumentList'
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentList'
        description: DocumentListName
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentList'
          description: OK
      summary: Create DocumentList
      tags:
      - DocumentList
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists/{documentListName}:
    delete:
      description: Delete Document List
      operationId: deleteDocumentList
      parameters:
      - description: Name of content documentListName to delete
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Delete Document List
      tags:
      - DocumentList
      x-accepts: application/json
    get:
      description: "Get Document List. The document list can only be accessed if the\
        \ API context is inclusive of the document list's scope. A document list always\
        \ belongs to a tenant context, denoted by the scopeType and scopeId fields.\
        \ For example, if a list belongs to Catalog 123 then it is denoted by scopeType=catalog\
        \ and scopeId=123."
      operationId: getDocumentList
      parameters:
      - description: Name of document documentListName to retrieve
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentList'
          description: OK
      summary: Get Document List
      tags:
      - DocumentList
      x-accepts: application/json
    put:
      description: "Update Document List. The document list can only be accessed if\
        \ the API context is inclusive of the document list's scope. A document list\
        \ always belongs to a tenant context, denoted by the scopeType and scopeId\
        \ fields. For example, if a list belongs to Catalog 123 then it is denoted\
        \ by scopeType=catalog and scopeId=123."
      operationId: updateDocumentList
      parameters:
      - description: The name of the documentList to update
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentList'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DocumentList'
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentList'
        description: Content Collection values to apply
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentList'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentList'
          description: OK
      summary: Update Document List
      tags:
      - DocumentList
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists/{documentListName}/documentTree/{documentName}:
    get:
      description: "Retrieves a specific Document within the specified ContentCollection\
        \ using the specified document name, unique within a specific folder with\
        \ the specified documentId, version, and status."
      operationId: getTreeDocument
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      - description: if this call should include a document that isn't active in the
          given preview date
        explode: true
        in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
            text/json:
              schema:
                $ref: '#/components/schemas/Document'
            text/plain:
              schema:
                $ref: '#/components/schemas/Document'
          description: OK
      summary: Get Document by Path
      tags:
      - Documents
      x-accepts: application/json
  /content/documentlists/{documentListName}/documentTree/{documentName}/content:
    delete:
      description: Delete Document Content by Path
      operationId: deleteTreeDocumentContent
      parameters:
      - explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
          text/plain:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
      responses:
        "200":
          description: OK
      summary: Delete Document Content by Path
      tags:
      - Documents
      x-content-type: application/json
      x-accepts: application/json
    get:
      description: "Returns transformations on a document. For example, resizing an\
        \ image."
      operationId: getTreeDocumentContent
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Document Content by Path
      tags:
      - Documents
      x-accepts: application/json
    head:
      description: Get Document Content Headers by Path
      operationId: getTreeDocumentContentHead
      parameters:
      - explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Document Content Headers by Path
      tags:
      - Documents
      x-accepts: application/json
    put:
      description: Update Document Content by Path
      operationId: updateTreeDocumentContent
      parameters:
      - description: The Mozu.Content.Contracts.DocumentList in which the document
          resides
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
          text/plain:
            schema:
              $ref: '#/components/schemas/ContentHttpRequestMessage'
        description: Binary document content to store must be less than 16M
      responses:
        "200":
          description: OK
      summary: Update Document Content by Path
      tags:
      - Documents
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists/{documentListName}/documentTree/{documentName}/transform:
    get:
      description: "Returns transformations on a document. For example, resizing an\
        \ image. By Path"
      operationId: transformTreeDocumentContent
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: false
        in: path
        name: documentName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: true
        in: query
        name: width
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: height
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: max
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: maxWidth
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: maxHeight
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: crop
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: quality
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Resized Image by Path
      tags:
      - Documents
      x-accepts: application/json
  /content/documentlists/{documentListName}/documents:
    delete:
      description: Delete Documents
      operationId: deleteByPath
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: true
        in: query
        name: path
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Delete Documents
      tags:
      - Documents
      x-accepts: application/json
    get:
      description: "Get Documents. To search documents along a particular path, use\
        \ the filter path such as in \"folder1\\folder2\\\". If no path is provided,\
        \ then the query will be a global search as it searches from the root of the\
        \ tree hierarchy."
      operationId: getDocuments
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: Mozu.Content.Contracts.PropertyType filter expression to match
          against document properties. <seealso cref="T:Mozu.Core.FilterParsing.FilterParser"
          />
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: Sort expression.  <seealso cref="T:Mozu.Core.FilterParsing.SortParser"
          />
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: Page size
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: First item in the page to return from the total result set
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: if this call should include a adocument that isn't active in
          the given preview date
        explode: true
        in: query
        name: includeInactive
        required: false
        schema:
          type: boolean
        style: form
      - description: path from which to return documents
        explode: true
        in: query
        name: path
        required: false
        schema:
          type: string
        style: form
      - description: if true this call will populate Subpaths
        explode: true
        in: query
        name: includeSubPaths
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |-
          Determines if the path parameter is used to scope the query to the specified path or ignored for a global scope.
                      Defaults to specified path only. Valid values are: SpecifiedPathOnly, Global
        explode: true
        in: query
        name: queryScope
        required: false
        schema:
          default: SpecifiedPathOnly
          type: string
        style: form
      - description: |-
          When `true`, performs an exhaustive search guaranteeing all matching documents are returned.
          Slower than the default on large lists. Returns HTTP 400 if the document list exceeds the configured
          maximum size threshold (default 100,000). Defaults to `false`, optimizing for speed.
        explode: true
        in: query
        name: fullSearch
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentCollection'
          description: OK
      summary: Get Documents
      tags:
      - Documents
      x-accepts: application/json
    post:
      description: "Create Document. However, if you are creating an empty folder\
        \ in the files list then you only need to provide the name, documentTypeFQN,\
        \ and listFQN fields - replace the name value with the full path of your folder."
      operationId: createDocument
      parameters:
      - description: ""
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Document'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/Document'
          text/plain:
            schema:
              $ref: '#/components/schemas/Document'
        description: The Mozu.Content.Contracts.Document to Add to the Mozu.Content.Contracts.DocumentList
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
            text/json:
              schema:
                $ref: '#/components/schemas/Document'
            text/plain:
              schema:
                $ref: '#/components/schemas/Document'
          description: OK
      summary: Create Document
      tags:
      - Documents
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists/{documentListName}/documents/copy:
    put:
      description: Copy Document
      operationId: copyDocuments
      parameters:
      - description: DocumentListName name where the documents reside
        explode: false
        in: path
        name: documentListName
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentCopyRequest'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/DocumentCopyRequest'
          text/plain:
            schema:
              $ref: '#/components/schemas/DocumentCopyRequest'
        description: Request containing Document Ids to copy and the destination path
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentCopyResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/DocumentCopyResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/DocumentCopyResponse'
          description: OK
      summary: Copy Document
      tags:
      - Documents
      x-content-type: application/json
      x-accepts: application/json
  /content/documentlists/{documentListName}/documents/move:
    put:
      description: "Move Document. This updates the path on all documents within a\
