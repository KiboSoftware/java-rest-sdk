                $ref: '#/components/schemas/ReservationAggregateSummary'
            text/plain:
              schema:
                $ref: '#/components/schemas/ReservationAggregateSummary'
          description: OK
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
          description: Content Too Large
      summary: Get Reservation Summary
      tags:
      - Reservation
      x-accepts: application/json
  /commerce/reservation/{reservationId}:
    delete:
      description: Delete a reservation. Set runSynchronous to "true" to perform this
        call synchronously with better performance time.
      operationId: deleteReservation
      parameters:
      - explode: false
        in: path
        name: reservationId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: runSynchronous
