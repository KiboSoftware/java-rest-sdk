                type: object
          description: OK
      summary: Get Allocation Status
      tags:
      - Reservation
      x-accepts: application/json
  /commerce/reservation/{reservationId}/items:
    post:
      description: Add an item to a reservation. Set runSynchronous to "true" to perform
