        in: path
        name: reservationId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservati'
      responses:
        "200":
          content:
            application/json:
              schema:
