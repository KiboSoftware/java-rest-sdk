                $ref: '#/components/schemas/Reservati'
          description: OK
      summary: Update Zip Code
      tags:
      - Reservation
      x-content-type: application/json
      x-accepts: application/json
components:
  schemas:
    Allocati:
      example:
        itemId: itemId
        futureDate: 2000-01-23T04:56:07.000+00:00
        transferLocationCode: transferLocationCode
        productCode: productCode
        quantity: 2
        allocationHistory:
        - deltaQuantity: 5
          runId: runId
          allocatedAt: 2000-01-23T04:56:07.000+00:00
        - deltaQuantity: 5
          runId: runId
          allocatedAt: 2000-01-23T04:56:07.000+00:00
        isStateChange: true
        allocationId: 5
        estimatedDeliveryDate: 2000-01-23T04:56:07.000+00:00
        fulfillmentLocationCode: fulfillmentLocationCode
      properties:
        allocationHistory:
          items:
            $ref: '#/components/schemas/AllocationEve'
          nullable: true
          type: array
        allocationId:
          format: int32
          nullable: true
          type: integer
        estimatedDeliveryDate:
          format: date-time
          nullable: true
          type: string
        fulfillmentLocationCode:
          nullable: true
          type: string
        futureDate:
          format: date-time
          nullable: true
          type: string
        isStateChange:
          type: boolean
        itemId:
          nullable: true
          type: string
        productCode:
          nullable: true
          type: string
        quantity:
          format: int32
          type: integer
        transferLocationCode:
          nullable: true
          type: string
      type: object
    AllocationEve:
      example:
        deltaQuantity: 5
        runId: runId
        allocatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        allocatedAt:
          format: date-time
          type: string
        deltaQuantity:
          format: int32
          type: integer
        runId:
          nullable: true
          type: string
      type: object
    AllocationStatusDemandEntry:
      example:
        totalDemand: 1
        allocationStatus: allocationStatus
        itemCount: 6
      properties:
        allocationStatus:
          nullable: true
          type: string
        itemCount:
          format: int32
          type: integer
        totalDemand:
          format: int64
          type: integer
      type: object
    AuditInf:
      example:
        createdAt: 2000-01-23T04:56:07.000+00:00
        updatedBy: updatedBy
        createdBy: createdBy
        updatedAt: 2000-01-23T04:56:07.000+00:00
      properties:
        createdAt:
          format: date-time
          type: string
        createdBy:
          nullable: true
          type: string
        updatedAt:
          format: date-time
          nullable: true
          type: string
        updatedBy:
          nullable: true
          type: string
      type: object
    BundledProdu:
      example:
        productCode: productCode
        quantity: 3
        optionValue: ""
        name: name
        goodsType: goodsType
        measurements:
          length:
            unit: unit
            value: 9.301444243932576
          width:
            unit: unit
            value: 9.301444243932576
          weight:
            unit: unit
            value: 9.301444243932576
          height:
            unit: unit
            value: 9.301444243932576
        optionAttributeFQN: optionAttributeFQN
      properties:
        goodsType:
          nullable: true
          type: string
        measurements:
          $ref: '#/components/schemas/ReservationWebAPIPackageMeasurements'
        name:
          nullable: true
          type: string
        optionAttributeFQN:
          nullable: true
          type: string
        optionValue:
          nullable: true
        productCode:
          nullable: true
          type: string
        quantity:
          format: int32
          type: integer
      type: object
    CallOffLineConsumpti:
      example:
        salesOrderId: salesOrderId
        consumedBy: consumedBy
        lineId: lineId
        consumedAt: 2000-01-23T04:56:07.000+00:00
        salesOrderNumber: 0
      properties:
        consumedAt:
          format: date-time
          type: string
        consumedBy:
          nullable: true
          type: string
        lineId:
          nullable: true
          type: string
        salesOrderId:
          nullable: true
          type: string
        salesOrderNumber:
          format: int32
          type: integer
      type: object
    CommerceRuntimeAddress:
      example:
        isValidated: true
        postalOrZipCode: postalOrZipCode
        address3: address3
        stateOrProvince: stateOrProvince
        address2: address2
        address1: address1
        addressType: addressType
        countryCode: countryCode
        address4: address4
        cityOrTown: cityOrTown
      properties:
        address1:
          nullable: true
          type: string
