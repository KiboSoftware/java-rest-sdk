openapi: 3.0.1
info:
  description: |-
    <div id="overview_RESERVATION">
                <h2>RESERVATIONS</h2>
                <p>The Reservation APIs are used to create and manage inventory reservations. This includes updating items and quantities, fulfillment methods, zip codes and pickup locations, and resetting
                    the expiration timer for a reservation. For more information, see the <a href="/pages/reserve-inventory-in-cart">Reservations feature guide</a>.
                </p>
            </div>
  title: Kibo Reservation Web API
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /commerce/reservation:
    get:
      description: Get all reservations.
      operationId: getReservations
      parameters:
      - explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: qLimit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Reservations
      tags:
      - Reservation
      x-accepts: application/json
    post:
      description: Creates a new reservation. Set runSynchronous to "true" to perform
        this call synchronously with better performance time.
      operationId: createReservation
      parameters:
      - explode: true
        in: query
        name: runSynchronous
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reservati'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/json:
              schema:
                $ref: '#/components/schemas/Reservati'
            text/plain:
              schema:
                $ref: '#/components/schemas/Reservati'
          description: OK
      summary: Create Reservation
      tags:
      - Reservation
      x-content-type: application/json
      x-accepts: application/json
