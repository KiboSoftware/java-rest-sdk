openapi: 3.0.1
info:
  description: |-
    <div id="overview_EVENT">
                <h2>EVENTS</h2>
                <p>The Event APIs are used to subscribe to notifications when create, read, update, or delete operations are
                    performed. If an application subscribes to the event, use the <strong>Events</strong> resource to query for
                    recent events published to your application or events that were not published successfully. See the <a href="/pages/event-subscription">Event Subscription documentation</a> for more information</p>
                <p>The <strong>Subscriptions</strong> resource triggers a push service to sent immediate notifications to the subscribed
                    tenants
                    and applications. The resource sends messages regarding a subscription event that occurs in the tenant
                    or site.</p>
            </div>
  title: Kibo Event Service
  version: v1
servers:
- url: "https://{homePodHost}/api"
security:
- bearerAuth: []
paths:
  /event/pull:
    get:
      description: Retrieves a list of events according to any specified filter criteria
        and sort options.
      operationId: getEvents
      parameters:
      - description: "Used to page results from a query. Indicates the zero-based\
          \ offset in the complete result set where the returned entities begin. For\
          \ example, with a PageSize of 25, to get the 51st through the 75th items,\
          \ startIndex=3. The default value is 0. Optional."
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: Used to page results from a query. Indicates the maximum number
          of entities to return from a query. The default value is 20 and the maximum
          value is 200. Optional.
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: The element to sort the results by and the order in which the
          results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: "A set of filter expressions representing the search parameters\
          \ for a query: eq=equals, ne=not equals, gt=greater than, lt = less than\
          \ or equals, gt = greater than or equals, lt = less than or equals, sw =\
          \ starts with, or cont = contains. Optional."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/EventCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/EventCollection'
          description: OK
      summary: Get Events
      tags:
      - Event
      x-accepts: application/json
  /event/pull/{eventId}:
    get:
      description: Retrieves the details of a single event.
      operationId: getEvent
      parameters:
      - description: Unique identifier of the event. System-supplied and read-only.
        explode: false
        in: path
        name: eventId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
