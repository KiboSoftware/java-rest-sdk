          items:
            type: string
          nullable: true
          type: array
        updateBy:
          description: Identifier of the user who updated the entity. System-supplied
            and read-only.
          nullable: true
          type: string
        updateDate:
          description: When the entity was updated. System-supplied and read-only.
          format: date-time
          nullable: true
          type: string
      type: object
