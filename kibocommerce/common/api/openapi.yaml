openapi: 3.0.1
info:
  description: OpenAPI Spec for Kibo Tenant Service
  title: Kibo Tenant Service
  version: v1
servers:
- url: "https://{homePodHost}/api"
security:
- bearerAuth: []
paths:
  /platform/tenants/{tenantId}:
    get:
      description: Retrieve information about a tenant. The attributes object will
        contain flags indicating whether or not certain features are enabled on the
        tenant. Kibo employees can reference <a href="/pages/tenant-attributes">this
        internal-only documentation</a> for a list of all attributes. </ul>
      operationId: getTenant
      parameters:
      - description: ""
        explode: false
        in: path
        name: tenantId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
            text/json:
              schema:
                $ref: '#/components/schemas/Tenant'
            text/plain:
              schema:
                $ref: '#/components/schemas/Tenant'
          description: OK
      summary: Get Tenant by ID
      tags:
      - Tenants
      x-accepts: application/json
components:
  schemas:
    AdminUserMasterCatalog:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntity'
      - $ref: '#/components/schemas/AdminUserMasterCatalog_allOf'
    BaseTenantEntity:
      properties:
        id:
          format: int32
          type: integer
        name:
          nullable: true
          type: string
      type: object
    BaseTenantEntityInternal:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntity'
      - $ref: '#/components/schemas/BaseTenantEntityInternal_allOf'
    Catalog:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntity'
      - $ref: '#/components/schemas/Catalog_allOf'
    CatalogExtended:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntityInternal'
      - $ref: '#/components/schemas/Catalog_allOf'
    Domain:
      properties:
        cName:
          nullable: true
          type: string
        createDate:
          format: date-time
          type: string
        domainName:
          nullable: true
          type: string
        ipAddress:
          nullable: true
          type: string
        isDomainManaged:
          type: boolean
        isInfrastructureRecord:
          type: boolean
        isPrimary:
          type: boolean
        isSystemAssigned:
          type: boolean
        siteId:
          format: int32
          nullable: true
          type: integer
        tenantId:
          format: int32
          type: integer
        updateDate:
          format: date-time
          type: string
        zone:
          nullable: true
          type: string
      type: object
    MasterCatalogExtended:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntityInternal'
      - $ref: '#/components/schemas/MasterCatalogExtended_allOf'
    Site:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntity'
      - $ref: '#/components/schemas/Site_allOf'
    SiteExtended:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntityInternal'
      - $ref: '#/components/schemas/SiteExtended_allOf'
    Tenant:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntity'
      - $ref: '#/components/schemas/Tenant_allOf'
    TenantAttribute:
      properties:
        createBy:
          nullable: true
          type: string
        createDate:
          format: date-time
          type: string
        name:
          nullable: true
          type: string
        updateBy:
          nullable: true
          type: string
        updateDate:
          format: date-time
          type: string
        value:
          nullable: true
      type: object
    TenantExtended:
      allOf:
      - $ref: '#/components/schemas/BaseTenantEntityInternal'
      - $ref: '#/components/schemas/TenantExtended_allOf'
    AdminUserMasterCatalog_allOf:
      properties:
        catalogs:
          items:
            $ref: '#/components/schemas/Catalog'
          nullable: true
          type: array
        defaultCurrencyCode:
          nullable: true
          type: string
        defaultLocaleCode:
          nullable: true
          type: string
        supportedLocaleCodes:
          items:
            type: string
          nullable: true
          type: array
        tenantId:
          format: int32
          type: integer
      type: object
      example: null
    BaseTenantEntityInternal_allOf:
      properties:
        createDate:
          format: date-time
          type: string
        deleteDate:
          format: date-time
          nullable: true
          type: string
        isDeleted:
          type: boolean
        status:
          nullable: true
          type: string
        updateDate:
          format: date-time
          type: string
      type: object
      example: null
    Catalog_allOf:
      properties:
        defaultCurrencyCode:
          nullable: true
          type: string
        defaultLocaleCode:
          nullable: true
          type: string
        masterCatalogId:
          format: int32
          type: integer
        tenantId:
          format: int32
          type: integer
      type: object
      example: null
    MasterCatalogExtended_allOf:
      properties:
        catalogs:
          items:
            $ref: '#/components/schemas/CatalogExtended'
          nullable: true
          type: array
        defaultCurrencyCode:
          nullable: true
          type: string
        defaultLocaleCode:
          nullable: true
          type: string
        supportedLocaleCodes:
          items:
            type: string
          nullable: true
          type: array
        tenantId:
          format: int32
          type: integer
      type: object
      example: null
    Site_allOf:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/TenantAttribute'
          nullable: true
          type: array
        catalogId:
          format: int32
          type: integer
        countryCode:
          nullable: true
          type: string
        currencyCode:
          nullable: true
          type: string
        domain:
          nullable: true
          type: string
        localeCode:
          nullable: true
          type: string
        primaryCustomDomain:
          nullable: true
          type: string
        tenantId:
          format: int32
          type: integer
      type: object
      example: null
    SiteExtended_allOf:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/TenantAttribute'
          nullable: true
          type: array
        catalogId:
          format: int32
          nullable: true
          type: integer
        countryCode:
          nullable: true
          type: string
        defaultCurrencyCode:
          nullable: true
          type: string
        defaultLocaleCode:
          nullable: true
          type: string
        domains:
          items:
            $ref: '#/components/schemas/Domain'
          nullable: true
          type: array
        isMozuRendered:
          nullable: true
          type: boolean
        masterCatalogId:
          format: int32
          nullable: true
          type: integer
        omsCatalogId:
          format: int32
          nullable: true
          type: integer
        routingTargetInfo:
          nullable: true
          type: string
        tenantId:
          format: int32
          type: integer
      type: object
      example: null
    Tenant_allOf:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/TenantAttribute'
          nullable: true
          type: array
        domain:
          nullable: true
          type: string
        expiry:
          format: date-time
          nullable: true
          type: string
        isDevTenant:
          type: boolean
        isUnified:
          type: boolean
        lastLoginDate:
          format: date-time
          nullable: true
          type: string
        masterCatalogs:
          items:
            $ref: '#/components/schemas/AdminUserMasterCatalog'
          nullable: true
          type: array
        sites:
          items:
            $ref: '#/components/schemas/Site'
          nullable: true
          type: array
      type: object
      example: null
    TenantExtended_allOf:
      properties:
        attributes:
          items:
            $ref: '#/components/schemas/TenantAttribute'
          nullable: true
          type: array
        devAccountId:
          format: int32
          nullable: true
          type: integer
        domain:
          $ref: '#/components/schemas/Domain'
        hardDeleteExpiry:
          format: date-time
          nullable: true
          type: string
        isDevTenant:
          type: boolean
        isHardDeleted:
          nullable: true
          type: boolean
        isHeadless:
          type: boolean
        isPermanent:
          nullable: true
          type: boolean
        isUnified:
          type: boolean
        kubeNamespace:
          nullable: true
          type: string
        lastLoginDate:
          format: date-time
          nullable: true
          type: string
        masterCatalogs:
          items:
            $ref: '#/components/schemas/MasterCatalogExtended'
          nullable: true
          type: array
        mozuInstanceId:
          nullable: true
          type: string
        omsEnabled:
          type: boolean
        routingTargetInfo:
          nullable: true
          type: string
        scaleUnitId:
          nullable: true
          type: string
        sites:
          items:
            $ref: '#/components/schemas/SiteExtended'
          nullable: true
          type: array
        softDeleteExpiry:
          format: date-time
          nullable: true
          type: string
        supportsCustomExtensions:
          type: boolean
        unifiedTenantType:
          nullable: true
          type: string
      type: object
      example: null
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. \r\n\r\n Enter\
        \ 'Bearer' [space] and then your token in the text input below.\r\n\r\nExample:\
        \ \"Bearer 12345abcdef\""
      scheme: bearer
      type: http
    clientOauth2:
      flows:
        clientCredentials:
          scopes: {}
          tokenUrl: /api/platform/applications/authtickets/oauth
      type: oauth2

