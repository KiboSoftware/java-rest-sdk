components:
  schemas:
    AppliedLineItemDiscount:
      allOf:
      - $ref: '#/components/schemas/PricingRuntimeAppliedDiscount'
      - $ref: '#/components/schemas/AppliedLineItemDiscount_allOf'
      description: Details of the discount applied to a product.
    AppliedOrderShippingDiscount:
      allOf:
      - $ref: '#/components/schemas/PricingRuntimeAppliedDiscount'
      - $ref: '#/components/schemas/AppliedOrderShippingDiscount_allOf'
    AutoAddDiscountTarget:
      example:
        includedProductCodes:
        - includedProductCodes
        - includedProductCodes
        friendlyDescription: friendlyDescription
        discountId: 0
      properties:
        discountId:
          description: Unique identifier of the discount. System-supplied and read-only.
          format: int32
          type: integer
        friendlyDescription:
          description: Friendly description of the discount.
          nullable: true
          type: string
        includedProductCodes:
          description: Included product codes
          items:
            type: string
          nullable: true
          type: array
      type: object
    CategoryDiscountCondition:
      description: Represents a product category and quantity constraint
      example:
        categoryId: 6
      properties:
        categoryId:
          description: Unique identifier of the category to which the discount condition
            applies.
          format: int32
          type: integer
      type: object
    CommerceRuntimeAddress:
      example:
        isValidated: true
        postalOrZipCode: postalOrZipCode
        address3: address3
        stateOrProvince: stateOrProvince
        address2: address2
        address1: address1
        addressType: addressType
        countryCode: countryCode
        address4: address4
        cityOrTown: cityOrTown
      properties:
        address1:
          nullable: true
          type: string
        address2:
          nullable: true
          type: string
        address3:
          nullable: true
          type: string
        address4:
          nullable: true
          type: string
        addressType:
          nullable: true
          type: string
        cityOrTown:
          nullable: true
          type: string
        countryCode:
          nullable: true
          type: string
        isValidated:
          nullable: true
          type: boolean
        postalOrZipCode:
          nullable: true
          type: string
        stateOrProvince:
          nullable: true
          type: string
      type: object
    CommerceRuntimeThresholdMessage:
      example:
        showInCart: true
        requiresCouponCode: true
        thresholdValue: 6.965117697638846
        showOnCheckout: true
        discountId: 3
        message: message
      properties:
        discountId:
          format: int32
          type: integer
        message:
          nullable: true
          type: string
        requiresCouponCode:
          type: boolean
        showInCart:
          type: boolean
        showOnCheckout:
          type: boolean
        thresholdValue:
          format: double
          type: number
      type: object
    ContinuityRecurrenceSettings:
      example:
        startOrdinal: 5
        stopOrdinal: 5
        interval: 1
      properties:
        interval:
          description: Interval until next discount applies
          format: int32
          nullable: true
          type: integer
        startOrdinal:
          description: Continuity ordinal to start discounting
          format: int32
          nullable: true
          type: integer
        stopOrdinal:
          description: Continuity ordinal to stop discounting
          format: int32
          nullable: true
          type: integer
      type: object
    DiscountCustomProperty:
      description: Represents a custom property for a discount.
      example:
        code: code
        name: name
        value: value
      properties:
        code:
          description: Gets or sets the code of the discount custom property.
          nullable: true
          type: string
        name:
          description: Gets or sets the name of the discount custom property.
          nullable: true
          type: string
        value:
          description: Gets or sets the value of the discount custom property.
          nullable: true
          type: string
      type: object
    FindDiscountsRequestBase:
      description: Request parameters to search for discounts
      properties:
        customerSegmentIds:
          description: |-
            List of customer segments that the discounts are applicable to.
            If not specified, only discounts that are not restricted to any customer segment are returned.
            When specified, only discounts that are applicable to one of the specified customer segments are returned.
          items:
            format: int32
            type: integer
          nullable: true
          type: array
        includeUnconditional:
          description: |-
            When true, include discounts that are applied when there is no condition on the discount.
            By default, these are not included.
          type: boolean
        isPurchaseRequirement:
          description: |-
            Set false to exclude discounts that require one of the specified products to be purchased
            default is true
          type: boolean
        labels:
          description: |-
            List of discount labels to filter discounts by.
            Limit: 10 labels
          items:
            type: string
          nullable: true
          type: array
        locationCodes:
          description: |-
            List of location codes to filter discounts by.
            when not specified all discounts are returned.
          items:
            type: string
          nullable: true
          type: array
        productCodes:
          description: |-
            List of product codes to query for discounts
            Limit: 20 product codes
          items:
            type: string
          nullable: true
          type: array
        targetType:
          description: |-
            Types of discounts to search for Product, Shipping, or All
            when not specified, all types are returned.
          nullable: true
          type: string
      type: object
    FindDiscountsResponse:
      example:
        discounts:
        - maximumUsesPerUser: 6
          maximumDiscountImpactPerRedemption: 9.965781217890562
          code: code
          preventOrderProductDiscounts: true
          doesNotApplyToMultiShipToOrders: true
          maximumDiscountImpactPerOrder: 5.025004791520295
          preventOrderShippingDiscounts: true
          content:
            key: content
          preventLineItemShippingDiscounts: true
          isBxGx: true
          scope: scope
          isPublic: true
          id: 4
          maximumRedemptionsPerOrder: 9
          expirationDate: 2000-01-23T04:56:07.000+00:00
          amountType: amountType
          amount: 0.8008281904610115
          doesNotApplyToSalePrice: true
          includedPriceLists:
          - includedPriceLists
          - includedPriceLists
          thresholdMessage:
            showInCart: true
            requiresCouponCode: true
            thresholdValue: 6.965117697638846
            showOnCheckout: true
            discountId: 3
            message: message
          canBeStackedUpon: true
          isSubscriptionDiscount: true
          labels:
          - labels
          - labels
          target:
            shippingZones:
            - zone: zone
            - zone: zone
            excludeItemsWithExistingProductDiscounts: true
            doNotApplyToHandlingFees: true
            excludeItemsWithExistingShippingDiscounts: true
            includedCategoriesOperator: includedCategoriesOperator
            type: type
            products:
            - productCode: productCode
            - productCode: productCode
            maximumQuantityPerRedemption: 6
            categories:
            - id: 9
            - id: 9
            excludedProducts:
            - productCode: productCode
            - productCode: productCode
            includeAllProducts: true
            excludedCategories:
            - id: 9
            - id: 9
            excludedCategoriesOperator: excludedCategoriesOperator
            shippingMethods:
            - code: code
              name: name
            - code: code
              name: name
          customProperties:
          - code: code
            name: name
            value: value
          - code: code
            name: name
            value: value
          doesNotApplyToProductsWithSalePrice: true
          hasPurchaseConditions: true
          isGroupDiscount: true
          pricingContext: pricingContext
          reevalFreeItemMinOrderPostDiscounts: true
          isUnconditional: true
          stackingLayer: 8
          conditions:
            customerSegments:
            - id: 2
            - id: 2
            maximumOrderAmount: 3.616076749251911
            minimumCategorySubtotalBeforeDiscounts: 7.386281948385884
            minimumRequiredQuantityPerRedemption: 7
            minDistinctProductsRequired: 2
            continuityRecurrenceSettings:
              startOrdinal: 5
              stopOrdinal: 5
              interval: 1
            maxRedemptionCount: 9
            minimumLifetimeValueAmount: 1.2315135367772556
