    RuntimeDiscountTarget:
      example:
        shippingZones:
        - zone: zone
        - zone: zone
        excludeItemsWithExistingProductDiscounts: true
        doNotApplyToHandlingFees: true
        excludeItemsWithExistingShippingDiscounts: true
        includedCategoriesOperator: includedCategoriesOperator
        type: type
        products:
        - productCode: productCode
        - productCode: productCode
        maximumQuantityPerRedemption: 6
        categories:
        - id: 9
        - id: 9
        excludedProducts:
        - productCode: productCode
        - productCode: productCode
        includeAllProducts: true
        excludedCategories:
        - id: 9
        - id: 9
        excludedCategoriesOperator: excludedCategoriesOperator
        shippingMethods:
        - code: code
          name: name
        - code: code
          name: name
      properties:
        categories:
          description: "List of categories to discount. When a discount applies to\
            \ a category, all products in the category are discounted."
          items:
            $ref: '#/components/schemas/PricingRuntimeTargetedCategory'
          nullable: true
          type: array
        doNotApplyToHandlingFees:
          description: Prevents the discount from being applied to handling fees
          nullable: true
          type: boolean
        excludeItemsWithExistingProductDiscounts:
          description: "Prevents order scoped discounts from layering over items that\
            \ already have a product discount with the \nsame type."
          nullable: true
          type: boolean
        excludeItemsWithExistingShippingDiscounts:
          description: "Prevents order scoped discounts from layering over items that\
            \ already have a shipping discount with the \nsame type."
          nullable: true
          type: boolean
        excludedCategories:
          description: List of categories to exclude from the discount. Useful to
            exclude specific child categories.
          items:
            $ref: '#/components/schemas/PricingRuntimeTargetedCategory'
          nullable: true
          type: array
        excludedCategoriesOperator:
          description: |-
            Applies to Included categories
            Defaults to Any
          nullable: true
          type: string
        excludedProducts:
          description: List of products that are excluded from the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          nullable: true
          type: array
        includeAllProducts:
          description: "If yes, the discount applies to all products sold on the storefront."
          nullable: true
          type: boolean
        includedCategoriesOperator:
          description: |-
            Applies to Included categories
            When Any, the target product can belong to any specified category.
            When All, the target product must belong to all specified categories.
            Defaults to Any
          nullable: true
          type: string
        maximumQuantityPerRedemption:
          description: "When a condition is specified, this property limits the number\
            \ of items that can be targeted per discount redemption with an order.\n\
            if multiple redemptions are allowed per order then multiples of this value\
            \ would be allowed in multiples of the associated \ncondition.\nIf no\
            \ condition is specified then this value is not used.  \nIf null and condition\
            \ exists, then defaults to 1."
          format: int32
          nullable: true
          type: integer
        products:
          description: List of products that are eligible for the discount.
          items:
            $ref: '#/components/schemas/TargetedProduct'
          nullable: true
          type: array
        shippingMethods:
          description: Shipping method that is eligible for shipping discounts. This
            is a shipping method defined in Shipping Settings.
          items:
            $ref: '#/components/schemas/PricingRuntimeTargetedShippingMethod'
          nullable: true
          type: array
        shippingZones:
          description: Shipping Zones that are applicable for this discount
          items:
            $ref: '#/components/schemas/PricingRuntimeTargetedShippingZone'
          nullable: true
          type: array
        type:
          description: "    Type of target to which the discount applies. Possible\
            \ values: <pre>Product</pre> or <pre>Shipping</pre>. \nIf this is a <pre>Product</pre>\
            \ type, you can specify which products or categories that the discount\
            \ applies to.\n    If this is a <pre>Shipping</pre> type then you must\
            \ specify which shipping methods apply."
          nullable: true
          type: string
      type: object
