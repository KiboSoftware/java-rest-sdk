openapi: 3.0.1
info:
  description: OpenAPI Spec for Kibo Redaction Service
  title: Kibo Redaction Service
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /platform/data/redaction/execute/{reportId}:
    post:
      description: Executes an approved draft redaction report. This action is irreversible
        — it permanently removes or overwrites all PII identified in the report. The
        report status changes from Draft to Executed and operationLog is populated.
        See the <a href="/developer-guides/redaction-services">Redaction Services
        Developer Guide</a> for the complete workflow and warnings.
      operationId: executeRedaction
      parameters:
      - explode: false
        in: path
        name: reportId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Execute Redaction
      tags:
      - Redaction
      x-accepts: application/json
  /platform/data/redaction/report:
    get:
      description: "Lists redaction reports for the tenant, with optional filtering\
        \ by status (Draft or Executed) and date range. Returns summary objects without\
        \ affectedEntities or operationLog; retrieve individual reports by ID for\
        \ full details. See the <a href=\"/developer-guides/redaction-services\">Redaction\
        \ Services Developer Guide</a> for auditing guidance."
      operationId: listRedactionReports
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportSummaryListResponse'
          description: OK
      summary: List Redaction Reports
      tags:
      - Redaction
      x-accepts: application/json
    post:
      description: Creates a draft redaction report by scanning tenant data for all
        PII associated with the specified data subject. No data is modified at this
        stage. Review the returned report before executing. See the <a href="/developer-guides/redaction-services">Redaction
        Services Developer Guide</a> for the complete two-phase workflow.
      operationId: generateRedactionReport
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Generate Redaction Report
      tags:
      - Redaction
      x-content-type: application/json
      x-accepts: application/json
  /platform/data/redaction/report/{reportId}:
    get:
      description: "Retrieves a single redaction report by ID. Returns the full report\
        \ including affectedEntities and, after execution, the operationLog. Use this\
        \ to review a draft before executing or to audit a completed redaction. See\
        \ the <a href=\"/developer-guides/redaction-services\">Redaction Services\
        \ Developer Guide</a> for field descriptions."
      operationId: getRedactionReport
      parameters:
      - explode: false
        in: path
        name: reportId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/json:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
            text/plain:
              schema:
                $ref: '#/components/schemas/RedactionReportResponse'
          description: OK
      summary: Get Redaction Report
      tags:
      - Redaction
      x-accepts: application/json
