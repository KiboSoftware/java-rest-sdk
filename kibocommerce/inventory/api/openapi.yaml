openapi: 3.0.0
info:
  description: "<div id=\"overview_INVENTORY\">\n            <h2>INVENTORY</h2>\n\
    \            <p>Use the Inventory API to retrieve the inventory levels of requested\
    \ products, refresh and adjust current\n                stock levels at fulfillment\
    \ locations, and tag segmented inventory for different channels. When using tags\
    \ for inventory segmentation, inventory records are separated into categories\
    \ to identify\n                which portions of its\n                total quantity\
    \ are intended for different channels, customer groups, fulfillment methods, or\
    \ other\n                needs.\n                This allows for setting a percentage\
    \ of the quantity that would be available for each category and\n            \
    \    setting discrete units at the location level as available for each category.\
    \ For example, tags could\n                define how much of each\n         \
    \       inventory record is set aside for a certain sales channel: the Kibo storefront,\
    \ Walmart, or Amazon. The\n                percentages of the\n              \
    \  inventory allotted for each channel would add up to 100% - the Kibo storefront\
    \ could have 80% of the\n                inventory, Amazon 10%, and Walmart 10%.\
    \ For more information, see the <a href=\"/developer-guides/inventory\">Inventory\
    \ guides</a>.</p>\n            <p>Use the <strong>Inventory</strong>, <strong>Inventory\
    \ Allocation</strong>, and <strong>Modify Inventory</strong> resources to retrieve\
    \ and update inventory levels.</p>  \n            <p>Use the <strong>Inventory\
    \ Job</strong> resource to retrieve information about your pending inventory update\
    \ processing jobs.</p> \n            <p>Use the <strong>Inventory Tag</strong>\
    \ and <strong>Tag Category</strong> resources to segment your inventory records.</p>\
    \ \n        </div>"
  title: Inventory
  version: "5.0"
servers:
- url: "https://{tenantPodHost}/api"
paths:
  /adjustFutureDate/{futureInventoryID}:
    put:
      description: Adjust future_date of future inventory
      operationId: adjustFutureDate
      parameters:
