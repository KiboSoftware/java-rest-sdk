      description: "Creates entirely new export configurations for both FTP and S3\
        \ settings. This call allows you to specify all the values for the Export\
        \ Settings object, such as file type and specific location groups or sites\
        \ (which cannot be edited through FTP- or S3-specific endpoints). This is\
        \ the initial setup request required to configure inventory export."
      operationId: createExportSettings
      parameters: []
      requestBody:
        $ref: '#/components/requestBodies/CreateExportSettingsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
