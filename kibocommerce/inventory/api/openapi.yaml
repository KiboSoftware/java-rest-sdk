      x-content-type: application/json
      x-accepts: application/json
  /commerce/inventory/v1/export/ftp/{exportSettingsName}/{exportSettingsFTPName}:
    delete:
      description: Deletes the specified FTP settings object. Not specifying the FTP
        Name/ID will delete all FTP settings within the Export Settings. This will
        not delete the entire Export Settings object.
      operationId: deleteExportSettingsFTP
      parameters:
      - description: Export Settings Name
        explode: false
        in: path
        name: exportSettingsName
        required: true
        schema:
          type: string
        style: simple
      - description: Export Settings FTP Name
        explode: false
        in: path
        name: exportSettingsFTPName
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletedCountResponse'
          description: Success
        "400":
