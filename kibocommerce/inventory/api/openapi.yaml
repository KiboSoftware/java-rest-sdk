  /commerce/inventory/v1/queue:
    get:
      description: Get the requested jobs.
      operationId: getJobs
      parameters:
      - description: Tenant specified unique Identifier of the owning location
        explode: true
        in: query
        name: locationCode
        required: false
        schema:
          type: string
        style: form
      - description: "The maximum number of results to return, defaults to 100 for\
          \ most"
        explode: true
        in: query
        name: limit
        required: false
        schema:
          type: integer
        style: form
      - description: User that owns the job
        explode: true
        in: query
        name: owner
        required: false
        schema:
          type: string
        style: form
      - description: Type of the Job Queue Request
        explode: true
        in: query
        name: types
        required: false
        schema:
          items:
            enum:
            - REFRESH
            - ADJUST
            - RELEASE_SHIPMENTS
            - CREATE_PICK_WAVE
            - CLOSE_PICK_WAVE
            - PUT_AWAY_FILE
            - SHORT_PICK_ERROR
            - BIN_AUDIT_START
            - BIN_AUDIT_COMPLETION
            - CREATE_BIN_AUDIT
            - RELEASE_PENDING_ITEMS
            type: string
          type: array
        style: form
      - description: The full name of the file that was picked up at the secure droppoint
          server before being split up by location.
        explode: true
        in: query
        name: originalFilename
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/JobQueueResponse'
                type: array
          description: Success
        "404":
          description: Job Not Found
      summary: Get Jobs
      tags:
      - InventoryJob
      x-accepts: application/json
  /commerce/inventory/v1/queue/{jobID}:
    get:
      description: "Get the specified inventory job. Use this call to monitor the\
        \ status of inventory upload, refresh, adjust, or deletion jobs. Once you\
        \ have a job ID — returned by endpoints such as Delete Inventory, Delete Items,\
        \ Refresh Inventory, or Adjust Inventory — continue polling this endpoint\
        \ until the job reaches a terminal status (`SUCCESS` or `FAILED`). For polling\
        \ patterns and monitoring guidance during bulk inventory deletions, see the\
        \ <a href=\"/pages/bulk-inventory-deletion\">Bulk Inventory Deletion guide</a>."
      operationId: getJob
      parameters:
      - description: Id of bin to get
        explode: false
        in: path
        name: jobID
