        \ change the isActive parameter is unsupported, and attempts to do so will\
        \ be ignored by the API. Instead, make a POST call to api/commerce/customer/accounts/{accountId}/action\
        \ and provide only { \"actionName\": \"DisableAccount\" } in the request body.\
        \ This will successfully disable the account and the isActive flag will be\
        \ automatically set as false."
      operationId: updateAccount
      parameters:
      - description: Unique identifier of the customer account.
        explode: false
        in: path
        name: accountId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
