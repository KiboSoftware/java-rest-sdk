openapi: 3.0.1
info:
  description: OpenAPI Spec for Kibo Admin User Service
  title: Kibo Admin User Service
  version: v1
servers:
- url: "https://{homePodHost}/api"
security:
- bearerAuth: []
paths:
  /platform/adminuser/accounts:
    get:
      description: Retrieves a list of Admin users for a specified site according
        to any specified filter criteria and sort options.
      operationId: getUsers
      parameters:
      - description: ""
        explode: true
        in: query
        name: emailAddress
        required: false
        schema:
          type: string
        style: form
      - description: ""
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        style: form
      - description: The element to sort the results by and the order in which the
          results appear. Either ascending (a-z) or descending (z-a) order. Optional.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: "A set of filter expressions representing the search parameters\
          \ for a query: eq=equals, ne=not equals, gt=greater than, lt = less than\
          \ or equals, gt = greater than or equals, lt = less than or equals, sw =\
          \ starts with, or cont = contains. Optional."
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: ""
        explode: true
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Users
      tags:
      - AdminUser
      x-accepts: application/json
    post:
      description: Creates a new user
      operationId: createUser
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: The user to be created
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Create User
      tags:
      - AdminUser
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/accounts/Reset-Password:
    post:
      description: Resets the password for a user specified by email address.
      operationId: resetPassword
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserResetPasswordInfo'
        description: "Email address of the user who has requested a password reset.\
          \ \n            Note that the site ID is passed in the request header."
      responses:
        "200":
          description: OK
      summary: Reset Password
      tags:
      - AdminUser
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}:
    delete:
      description: Removes a user account from the site.
      operationId: deleteUser
      parameters:
      - description: Unique identifier of the user account to delete.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Delete User
      tags:
      - AdminUser
      x-accepts: application/json
    get:
      description: Retrieves the details of a user specified by user ID.
      operationId: getUser
      parameters:
      - description: Unique identifier of the user whose details you want to view.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Get User
      tags:
      - AdminUser
      x-accepts: application/json
    put:
      description: Modifies user information for a specified user.
      operationId: updateUser
      parameters:
      - description: Unique identifier of the user whose login information you want
          to change.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
        description: "Details of the new user account. Required properties: EmailAddress,\
          \ FirstName, LastName, and Password. Note that the site ID is passed in\
          \ the request header."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Update User
      tags:
      - AdminUser
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/Change-Password:
    post:
      description: Change a password
      operationId: changePassword
      parameters:
      - description: Unique identifier of the user for whom to change the password.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserPasswordInfo'
        description: Old password and new password.
      responses:
        "200":
          description: OK
      summary: Change Password
      tags:
      - AdminUser
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/Change-User-Password:
    post:
      description: Changes a user's password to the provided new password
      operationId: changeUserPassword
      parameters:
      - description: Unique identifier of the user for whom to change the password.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserPasswordInfo'
        description: New password info for this user
      responses:
        "200":
          description: OK
      summary: Change User Password
      tags:
      - AdminUser
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/roles:
    get:
      description: Retrieves all the roles for a specified user on the specified tenant.
      operationId: getUserRoles
      parameters:
      - description: Unique identifier of the user.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserUserRoleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminUserUserRoleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminUserUserRoleCollection'
          description: OK
      summary: Get User Roles
      tags:
      - AdminUser
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/roles/{roleId}:
    delete:
      description: Removes a role from the specified Admin account.
      operationId: removeUserRole
      parameters:
      - description: Unique identifier of the user with the role to delete.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: Unique identifer of the role to delete.
        explode: false
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      responses:
        "200":
          description: OK
      summary: Remove User Role
      tags:
      - AdminUser
      x-accepts: application/json
    post:
      description: Adds a role to the specified user's Admin account.
      operationId: addUserRole
      parameters:
      - description: Unique identifier of the user who receives the role.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: Unique identifier of the role to add.
        explode: false
        in: path
        name: roleId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Add User Role
      tags:
      - AdminUser
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/tenants:
    get:
      description: Get tenant scope for users
      operationId: getTenantScopesForUser
      parameters:
      - description: ""
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantCollection'
          description: OK
      summary: Get Tenant Scope
      tags:
      - AdminUser
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/unlock:
    post:
      description: Unlocks (or "enables") a user
      operationId: unlockUser
      parameters:
      - description: The user id.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Unlock User
      tags:
      - AdminUser
      x-accepts: application/json
  /platform/adminuser/accounts/{userId}/userbyid:
    get:
      description: Retrieves the details of a user specified by user ID.
      operationId: getUserById
      parameters:
      - description: Unique identifier of the user whose details you want to view.
        explode: false
        in: path
        name: userId
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: true
        in: query
        name: responseGroups
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
            text/json:
              schema:
                $ref: '#/components/schemas/User'
            text/plain:
              schema:
                $ref: '#/components/schemas/User'
          description: OK
      summary: Get User By Id
      tags:
      - AdminUser
      x-accepts: application/json
  /platform/adminuser/authtickets:
    delete:
      description: Logs out a user by deleting the refresh token
      operationId: deleteUserAuthTicket
      parameters:
      - description: The refresh token to delete.
        explode: true
        in: query
        name: refreshToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Delete User Auth Ticket
      tags:
      - AdminAuthTicket
      x-accepts: application/json
  /platform/adminuser/authtickets/tenants:
    post:
      description: Authenticates a user for a particular tenant given a set of user
        credentials and a tenantId.
      operationId: createUserAuthTicket
      parameters:
      - description: Optional tenant Id parameter
        explode: true
        in: query
        name: tenantId
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAuthInfo'
        description: User's email address and password.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Create User Auth Ticket
      tags:
      - AdminAuthTicket
      x-content-type: application/json
      x-accepts: application/json
    put:
      description: "Reauthenticates the current user for a different tenant. If the\
        \ user does not have access to the tenant, the operation fails."
      operationId: refreshAuthTicket
      parameters:
      - description: The tenant to authenticate the user in
        explode: true
        in: query
        name: tenantId
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantAdminUserAuthTicket'
        description: An existing valid auth ticket containing the refresh token.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Refresh Auth Ticket
      tags:
      - AdminAuthTicket
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/authtickets/wsfed/SignOut/{id}:
    get:
      description: Get Ws Fed Sign Out Url
      operationId: getWsFedSignOutUrl
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: redirect
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: ssoNameId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: session
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Get Ws Fed Sign Out Url
      tags:
      - AdminAuthTicket
      x-accepts: application/json
  /platform/adminuser/authtickets/wsfed/auth/{id}:
    post:
      description: Create User Auth Ticket With Ws Fed
      operationId: createUserAuthTicketWithWsFed
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: scopeid
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: scopeType
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/json:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
            text/plain:
              schema:
                $ref: '#/components/schemas/TenantAdminUserAuthTicket'
          description: OK
      summary: Create User Auth Ticket With Ws Fed
      tags:
      - AdminAuthTicket
      x-accepts: application/json
  /platform/adminuser/authtickets/wsfed/challenge/{id}:
    get:
      description: Get Ws Fed Challenge Url
      operationId: getWsFedChallengeUrl
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: scopeid
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: scopeType
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: redirect
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: invitationId
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
            text/json:
              schema:
                type: string
            text/plain:
              schema:
                type: string
          description: OK
      summary: Get Ws Fed Challenge Url
      tags:
      - AdminAuthTicket
      x-accepts: application/json
  /platform/adminuser/groups:
    get:
      description: Gets a collection of user groups
      operationId: getAdminGroups
      parameters:
      - description: ""
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 100
          format: int32
          type: integer
        style: form
      - description: ""
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: ""
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroupCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminGroupCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminGroupCollection'
          description: OK
      summary: Get Admin Groups
      tags:
      - AdminGroup
      x-accepts: application/json
    post:
      description: Adds an admin group
      operationId: addAdminGroup
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGroup'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminGroup'
          description: OK
      summary: Add Admin Group
      tags:
      - AdminGroup
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/groups/{groupCode}:
    delete:
      description: Deletes an Admin Group
      operationId: deleteAdminGroup
      parameters:
      - description: ""
        explode: false
        in: path
        name: groupCode
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: OK
      summary: Delete Admin Group
      tags:
      - AdminGroup
      x-accepts: application/json
    get:
      description: Gets an Admin group by id
      operationId: getAdminGroup
      parameters:
      - description: groupCode
        explode: false
        in: path
        name: groupCode
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminGroup'
          description: OK
      summary: Get Admin Group
      tags:
      - AdminGroup
      x-accepts: application/json
    put:
      description: Update an existing adminGroup
      operationId: updateAdminGroup
      parameters:
      - description: ""
        explode: false
        in: path
        name: groupCode
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminGroup'
        description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/json:
              schema:
                $ref: '#/components/schemas/AdminGroup'
            text/plain:
              schema:
                $ref: '#/components/schemas/AdminGroup'
          description: OK
      summary: Update Admin Group
      tags:
      - AdminGroup
      x-content-type: application/json
      x-accepts: application/json
  /platform/adminuser/groups/{groupCode}/addusers:
    post:
      description: Add users to admin group
      operationId: addUsers
      parameters:
      - description: ""
        explode: false
        in: path
        name: groupCode
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: string
              type: array
        description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
