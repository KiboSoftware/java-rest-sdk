openapi: 3.0.1
info:
  description: "<div id=\"overview_IMPORTEXPORT\">\n            <h2>Import Export</h2>\n\
    \            <p>The Import Export APIs are used to \"import and export\" Kibo's\
    \ resources efficiently in <strong>CSV</strong> file format.</p>\n           \
    \ <p> For Importing, files are first zipped and uploaded via the <strong>Files\
    \ API</strong>. Then an import job can be created, referencing the uploaded files\
    \ using the <strong>Import API.</strong></p>\n            <p> For Exporting, create\
    \ an export job via the  <strong></strong>Export API, specifying  the resource\
    \ to be exported. Then after completion, the csv extracts can be downloaded via\
    \ the <strong>File API</strong></p>\n            \n        </div>"
  title: Kibo MongoAdmin Service
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /platform/data/batchJob:
    get:
      description: Gets all batch jobs
      operationId: getBatchJobs
      parameters:
      - explode: true
        in: query
        name: domain
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: includeCount
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchJobCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/BatchJobCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/BatchJobCollection'
          description: OK
      summary: Get Batch Jobs
      tags:
      - BatchJob
      x-accepts: application/json
    post:
      description: Creates a new batch job
      operationId: createBatchJob
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
