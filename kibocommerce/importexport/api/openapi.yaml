      example:
        createBy: createBy
        updateDate: 2000-01-23T04:56:07.000+00:00
        updateBy: updateBy
        createDate: 2000-01-23T04:56:07.000+00:00
      properties:
        createBy:
          nullable: true
          type: string
        createDate:
          format: date-time
          nullable: true
          type: string
        updateBy:
          nullable: true
          type: string
        updateDate:
          format: date-time
          nullable: true
          type: string
      type: object
    BatchDomains:
      enum:
      - Catalog
      type: string
    BatchJob:
      example:
        auditInfo:
          createBy: createBy
          updateDate: 2000-01-23T04:56:07.000+00:00
          updateBy: updateBy
          createDate: 2000-01-23T04:56:07.000+00:00
        code: code
        dateStarted: 2000-01-23T04:56:07.000+00:00
        domain: null
