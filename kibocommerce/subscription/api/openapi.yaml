openapi: 3.0.1
info:
  description: "<div id=\"overview_SUBSCRIPTION\">\n            <h2>SUBSCRIPTIONS</h2>\n\
    \            <p>The Subscription APIs are used to create and manage subscriptions\
    \ in either an eCommerce+OMS implementation or a standalone \n               \
    \ Subscriptions solution. This includes updating items and quantities, subscription\
    \ frequency, coupons, and performing actions \n                on a subscription\
    \ in addition to turning a subscription into an order. For more information, see\
    \ the <a href=\"/pages/product-subscriptions\">Subscriptions feature guide</a>.\n\
    \            </p>\n        </div>"
  title: Kibo SubscriptionRuntime Service
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /commerce/subscriptions:
    get:
      description: Retrieves a list of subscriptions according to any specified filter
        criteria and sort options.
      operationId: getSubscriptions
      parameters:
      - description: The start index.
        explode: true
        in: query
        name: startIndex
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: Size of the page.
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: The sort by.
        explode: true
        in: query
        name: sortBy
        required: false
        schema:
          type: string
        style: form
      - description: The filter.
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: The q.
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: The q limit.
        explode: true
        in: query
        name: qLimit
        required: false
        schema:
          format: int32
          type: integer
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscriptionCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscriptionCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscriptionCollection'
          description: OK
      summary: Get Subscriptions
      tags:
      - Subscription
      x-accepts: application/json
    post:
      description: Creates and validates a new subscription.
      operationId: createSubscription
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
        description: The subscription.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Creates Subscription
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/reasons:
    get:
      description: Gets available subscription action reasons for the given category.
        If no category is supplied will give available Cancel action reasons.
      operationId: getReasons
      parameters:
      - description: Action to get available reasons for. Defaults to CANCEL
        explode: true
        in: query
        name: category
        required: false
        schema:
          default: CANCEL
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionReasonCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionReasonCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionReasonCollection'
          description: OK
      summary: Get Reasons
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}:
    get:
      description: Retrieves the details of a subscription specified by the subscription
        ID.
      operationId: getSubscription
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: return draft version of subscription.
        explode: true
        in: query
        name: draft
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Gets Subscription
      tags:
      - Subscription
      x-accepts: application/json
    put:
      description: Update the info for an existing subscription
      operationId: updateSubscription
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
        description: The subscription.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Update Subscription
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/actions:
    put:
      description: "Perform the specified action on subscription. Available actions\
        \ are Activate, Pause, Cancel, and RetryFailedContinuityOrder."
      operationId: performSubscriptionAction
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAction'
        description: "Action to perform, which can be \"Activate,\" \"Pause,\" \"\
          Cancel\"."
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Perform Subscription Action
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/adjustments:
    post:
      description: "Update item, shipping and handling adjustments on the subscription."
      operationId: updateAdjustments
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscriptionAdjustment'
        description: Adjustments for subscription.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Update Adjustments
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/attributes:
    get:
      description: Gets the list of attributes specified by subscription Id.
      operationId: getSubscriptionAttributes
      parameters:
      - description: ""
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: draft
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
          description: OK
      summary: Get Subscription Attributes
      tags:
      - Subscription
      x-accepts: application/json
    post:
      description: Creates list of subscription attributes specified by subscription
        Id.
      operationId: createSubscriptionAttributes
      parameters:
      - description: ""
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/SubscriptionAttribute'
              type: array
        description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
          description: OK
      summary: Create Subscription Attributes
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
    put:
      description: Updates the list of subscription attributes specified by subscription
        id and removes the missing attributes if not passed when removeMissing flag
        is set.
      operationId: updateSubscriptionAttribute
      parameters:
      - description: ""
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: ""
        explode: true
        in: query
        name: removeMissing
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/SubscriptionAttribute'
              type: array
        description: ""
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/SubscriptionAttribute'
                type: array
          description: OK
      summary: Update Subscription Attribute
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/cleardraft:
    put:
      description: Delete subscription draft
      operationId: clearSubscriptionDraft
      parameters:
      - description: ""
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Delete Subscription Draft
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/converttoorder:
    put:
      description: Convert the subscription to order.
      operationId: convertToOrder
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            text/json:
              schema:
                $ref: '#/components/schemas/Order'
            text/plain:
              schema:
                $ref: '#/components/schemas/Order'
          description: OK
      summary: Convert To Order
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/coupons/{couponCode}:
    put:
      description: Apply coupon to the Subscription.
      operationId: applyCoupon
      parameters:
      - description: Unique identifier of the Subscription with which to associate
          the coupon.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: Coupon code that the customer supplies to get the discounted
          price.
        explode: false
        in: path
        name: couponCode
        required: true
        schema:
          type: string
        style: simple
      - description: "updateMode\">Determines the update strategy for this update\
          \ (ApplyToOriginal, ApplyToDraft)."
        explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Apply Coupon
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/data:
    get:
      description: Retrieves all the values in the Subscription Data bag
      operationId: getSubscriptionData
      parameters:
      - description: Unique Identifier of the Subscription whose Data you want to
          get
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: draft
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/plain:
              schema:
                type: object
          description: OK
      summary: Get Subscription Data
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/data/{subscriptionDataId}:
    delete:
      description: Delete Value of the given Key in the SubscriptionData bag.
      operationId: deleteSubscriptionData
      parameters:
      - description: Unique Identifier of the Subscription you want to Delete the
          Databag for
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: URLEncoded Key for the Value you want to Delete from the Subscription
          DataBag
        explode: false
        in: path
        name: subscriptionDataId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/plain:
              schema:
                type: object
          description: OK
      summary: Delete Subscription Data
      tags:
      - Subscription
      x-accepts: application/json
    put:
      description: Insert / Updates the Value of the given Key in the Subscription
        Data bag.
      operationId: updateSubscriptionData
      parameters:
      - description: Unique Identifier of the Subscription you want to insert / update
          the Databag for
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: URLEncoded Key for the Value you want to Insert / Update from
          the Subscription DataBag
        explode: false
        in: path
        name: subscriptionDataId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema: {}
        description: Data Object you are trying to insert / update
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/plain:
              schema:
                type: object
          description: OK
      summary: Update Subscription Data
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/frequency:
    put:
      description: Update the frequency on an existing subscription
      operationId: updateSubscriptionFrequency
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Frequency'
        description: The requested frequency for update
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Update Subscription Frequency
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/fulfillmentinfo:
    put:
      description: Modifies the Fulfillment Info for a subscription.
      operationId: updateFulfillmentInfo
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: "Determines the update strategy for this update (ApplyToOriginal,\
          \ ApplyToDraft)."
        explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FulfillmentInfo'
        description: New fulfillment info for subscription.
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FulfillmentInfo'
            text/json:
              schema:
                $ref: '#/components/schemas/FulfillmentInfo'
            text/plain:
              schema:
                $ref: '#/components/schemas/FulfillmentInfo'
          description: OK
      summary: Update Fulfillment Info
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/installmentPlan:
    put:
      description: Updates the installment plan on the subscription.
      operationId: updateInstallmentPlan
      parameters:
      - description: The subscription identifier.
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: "Determines the update strategy for this update (ApplyToOriginal,\
          \ ApplyToDraft)."
        explode: true
        in: query
        name: updateMode
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallmentPlanRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/json:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
            text/plain:
              schema:
                $ref: '#/components/schemas/SubscriptionRuntimeSubscription'
          description: OK
      summary: Update Installment plan
      tags:
      - Subscription
      x-content-type: application/json
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/item/{subscriptionItemId}/data:
    get:
      description: Retrieves a specific value in the SubscriptionItem Data bag.
      operationId: getSubscriptionItemData
      parameters:
      - description: Unique Identifier of the Subscription you want to get the Subscription
          Items for
        explode: false
        in: path
        name: subscriptionId
        required: true
        schema:
          type: string
        style: simple
      - description: Unique Identifier of the SubscriptionItem whose Data you want
          to get
        explode: false
        in: path
        name: subscriptionItemId
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: draft
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
            text/json:
              schema:
                type: object
            text/plain:
              schema:
                type: object
          description: OK
      summary: Get Subscription Item Data
      tags:
      - Subscription
      x-accepts: application/json
  /commerce/subscriptions/{subscriptionId}/item/{subscriptionItemId}/data/{subscriptionItemDataId}:
    delete:
      description: Deletes the Value of the given Key in the SubscriptionItem Data
        bag.
      operationId: deleteSubscriptionItemData
      parameters:
      - description: Unique Identifier of the Subscription you want to get the Items
          for
        explode: false
