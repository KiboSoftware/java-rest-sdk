      x-accepts: application/json
    put:
      description: Updates the suggester settings for the site
      operationId: updateSuggestSettings
      parameters:
      - description: "Language code use by the site (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Suggester'
          application/octet-stream:
            schema:
              $ref: '#/components/schemas/Suggester'
          application/zip:
            schema:
              $ref: '#/components/schemas/Suggester'
          text/plain:
            schema:
              $ref: '#/components/schemas/Suggester'
        description: Suggest definition in
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggester'
            text/json:
              schema:
                $ref: '#/components/schemas/Suggester'
            text/plain:
              schema:
                $ref: '#/components/schemas/Suggester'
          description: OK
      summary: Updates the suggester settings for the site
      tags:
      - SuggestDefinition
      x-content-type: application/json
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/suggest/{language}:
    get:
      description: Downloads the suggest file for the site
      operationId: downLoadSuggest
      parameters:
      - description: "Language code used by the site (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Downloads the suggest file for the site
      tags:
      - SuggestDefinition
      x-accepts: application/json
    put:
      description: Uploads a suggest file for the site in tab separated format)
      operationId: uploadSuggest
      parameters:
      - description: "language code use by the site (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Uploads a suggest file for the site in tab separated format)
      tags:
