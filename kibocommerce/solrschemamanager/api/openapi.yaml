      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
            text/json:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
            text/plain:
              schema:
                $ref: '#/components/schemas/SchemaDefinition'
          description: OK
      summary: Update Schema Definition
      tags:
      - SchemaDefinition
      x-content-type: application/json
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/definition/{language}/publish:
    post:
      description: Publish
      operationId: publish
      parameters:
