          description: OK
      summary: Get Schema Definition
      tags:
      - SchemaDefinition
      x-accepts: application/json
    put:
      description: Update Schema Definition
      operationId: updateSchemaDefinition
      parameters:
      - explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      requestBody:
