components:
  schemas:
    AdminUserAuditInfo:
      example:
        createBy: createBy
        updateDate: 2000-01-23T04:56:07.000+00:00
        updateBy: updateBy
        createDate: 2000-01-23T04:56:07.000+00:00
      properties:
        createBy:
          nullable: true
          type: string
        createDate:
          format: date-time
          nullable: true
          type: string
        updateBy:
          nullable: true
          type: string
        updateDate:
          format: date-time
          nullable: true
          type: string
      type: object
    AttributeVocabularyValueLocalizedContent:
      properties:
        stringValue:
          minLength: 1
          nullable: false
    CatalogAdminsAttributeVocabularyValue:
      properties:
        mappedGenericValues:
          maxItems: 200
        value:
          maxLength: 50
          nullable: false
          pattern: "^[A-Za-z0-9-_\\.()]*[A-Za-z0-9-_()]"
    CatalogAdminsBundledProduct:
      properties:
        quantity:
          nullable: false
    CatalogAdminsDiscount:
      properties:
        amount:
          exclusiveMinimum: true
          minimum: 0
        amountType:
          nullable: false
        canBeDeleted:
          nullable: false
        code:
          maxLength: 50
          pattern: "^[A-Za-z0-9-_\\.()]*[A-Za-z0-9-_()]$"
        hasPurchaseConditions:
          nullable: false
        maximumDiscountImpactPerOrder:
          exclusiveMinimum: true
          minimum: 0
        maximumDiscountImpactPerRedemption:
          exclusiveMinimum: true
          minimum: 0
        maximumRedemptionsPerOrder:
          exclusiveMinimum: true
          minimum: 0
        maximumUsesPerUser:
          exclusiveMinimum: true
          minimum: 0
        scope:
          nullable: false
    CatalogAdminsDiscountCondition:
      properties:
        maxRedemptionCount:
          exclusiveMinimum: true
          minimum: 0
        minimumQuantityProductsRequiredInCategories:
          exclusiveMinimum: true
          minimum: 0
        minimumQuantityRequiredProducts:
          exclusiveMinimum: true
          minimum: 0
        requiresAuthenticatedUser:
          nullable: false
        requiresCoupon:
          nullable: false
    CatalogAdminsDiscountTarget:
      properties:
        maximumQuantityPerRedemption:
          exclusiveMinimum: true
          minimum: 0
        type:
          nullable: false
    CatalogAdminsProduct:
      properties:
        hasConfigurableOptions:
          nullable: false
        hasStandAloneOptions:
          nullable: false
        isVariation:
          nullable: false
        productCollectionProducts:
          maxItems: 35
    CatalogAdminsProductImageGroup:
      properties:
        productImageGroupId:
          nullable: false
    CatalogAdminsProductImageGroupTag:
      properties:
        fqn:
          nullable: false
    CatalogAdminsProductPrice:
      properties:
        price:
          minimum: 0
        salePrice:
          minimum: 0
    CatalogAdminsTargetedShippingMethod:
      properties:
        code:
          maxLength: 100
          nullable: false
    CatalogAdminsTargetedShippingZone:
      properties:
        zone:
          maxLength: 200
          nullable: false
    CatalogAdminsThresholdMessage:
      properties:
        discountId:
          nullable: false
        isActive:
          nullable: false
        requiresCouponCode:
          nullable: false
        showInCart:
          nullable: false
        showOnCheckout:
          nullable: false
        thresholdValue:
          nullable: false
    CategoryDiscountCondition:
      properties:
        categoryId:
          nullable: false
    DiscountLocalizedContent:
      properties:
        localeCode:
          maxLength: 8
        name:
          maxLength: 200
          nullable: false
    FieldTypeDefinitionRepositoryEntry:
      description: ""
      example:
        name: name
        description: description
        usageRestrictions: ""
        solrFieldType: ""
        suffix: suffix
      properties:
        description:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        solrFieldType:
          nullable: true
        suffix:
          nullable: true
          type: string
        usageRestrictions:
          description: |-
            Restricts the fields used by specific SOLR analyzer.
            Originally developed for entity extraction/ aka noun_extraction
            (e.g. searching for sofa tables should return tables, not sofas)
          nullable: true
      type: object
    PricingRuntimeCustomerSegment:
      properties:
        id:
          nullable: false
    ProductCategory:
      properties:
        categoryId:
          nullable: false
    ProductExtraValueDeltaPrice:
      properties:
        deltaPrice:
          nullable: false
    ProductInCatalogInfo:
      description: "Use the Products resource to create and manage products for your\
        \ store. You can create products with options that a shopper configures (such\
        \ as a T-shirt color and size). The system can manage inventory for all combinations\
        \ of your product options, and can calculate tax and shipping costs."
      properties:
        catalogId:
          nullable: false
    ProductLocalizedContent:
      properties:
        productName:
          nullable: false
          pattern: ^(?!\s+).+(?<!\s)$
    SchemaDefinition:
      example:
        auditInfo:
          createBy: createBy
          updateDate: 2000-01-23T04:56:07.000+00:00
          updateBy: updateBy
          createDate: 2000-01-23T04:56:07.000+00:00
        spellingFields:
        - ingestFieldName: ingestFieldName
        - ingestFieldName: ingestFieldName
        spellCorrectEnabled: true
        isPublished: true
        language: language
        fields:
        - fieldName: fieldName
          ingestFieldName: ingestFieldName
          fieldDefinition: fieldDefinition
          friendlyName: friendlyName
          searchFieldName: searchFieldName
        - fieldName: fieldName
          ingestFieldName: ingestFieldName
          fieldDefinition: fieldDefinition
          friendlyName: friendlyName
          searchFieldName: searchFieldName
      properties:
        auditInfo:
          $ref: '#/components/schemas/AdminUserAuditInfo'
        fields:
          items:
            $ref: '#/components/schemas/SchemaDefinitionField'
          type: array
        isPublished:
          readOnly: true
          type: boolean
        language:
          minLength: 1
          type: string
        spellCorrectEnabled:
          description: Returns boolean if contains any SpellingFields members.
          nullable: true
          type: boolean
        spellingFields:
          description: List of attributes used in the spelling dictionary
          items:
            $ref: '#/components/schemas/SpellingSchemaDefinitionField'
          nullable: true
          type: array
      required:
      - fields
      - language
      type: object
    SchemaDefinitionField:
      example:
        fieldName: fieldName
        ingestFieldName: ingestFieldName
        fieldDefinition: fieldDefinition
        friendlyName: friendlyName
        searchFieldName: searchFieldName
      properties:
        fieldDefinition:
          minLength: 1
          type: string
        fieldName:
          minLength: 1
          type: string
        friendlyName:
          nullable: true
          type: string
        ingestFieldName:
          nullable: true
          readOnly: true
          type: string
        searchFieldName:
          nullable: true
          readOnly: true
          type: string
      required:
      - fieldDefinition
      - fieldName
      type: object
    SpellingSchemaDefinitionField:
      example:
        ingestFieldName: ingestFieldName
      properties:
        ingestFieldName:
          nullable: true
          type: string
      type: object
    Suggester:
      example:
        highlight: highlight
        allTermsRequired: allTermsRequired
        name: name
      properties:
        allTermsRequired:
          nullable: true
          type: string
        highlight:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    ThresholdMessageLocalizedContent:
      properties:
        localeCode:
          maxLength: 8
        messageTemplate:
          nullable: false
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. \r\n\r\n Enter\
        \ 'Bearer' [space] and then your token in the text input below.\r\n\r\nExample:\
        \ \"Bearer 12345abcdef\""
      scheme: bearer
      type: http

