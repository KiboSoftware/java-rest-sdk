      - SchemaDefinition
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/definition/{language}:
    get:
      description: Get Schema Definition
      operationId: getSchemaDefinition
      parameters:
      - explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: published
        required: false
        schema:
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
