        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: reindex
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            text/plain:
              schema:
                type: boolean
          description: OK
      summary: Publish
      tags:
      - SchemaDefinition
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/definition/{language}/revert:
    post:
      description: Revert
      operationId: revert
      parameters:
      - explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                type: boolean
            text/json:
              schema:
                type: boolean
            text/plain:
              schema:
                type: boolean
          description: OK
      summary: Revert
      tags:
      - SchemaDefinition
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/fieldTypes/{language}:
    get:
      description: Get Field Type Definitions
      operationId: getFieldTypeDefinitions
      parameters:
      - explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/FieldTypeDefinitionRepositoryEntry'
                type: array
            text/json:
              schema:
                items:
                  $ref: '#/components/schemas/FieldTypeDefinitionRepositoryEntry'
                type: array
            text/plain:
              schema:
                items:
                  $ref: '#/components/schemas/FieldTypeDefinitionRepositoryEntry'
                type: array
          description: OK
      summary: Get Field Type Definitions
      tags:
      - FieldTypeDefinition
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/stopwords/{language}:
    get:
      description: "Downloads the stopwords file for the language. This is a .txt\
        \ file, not a JSON response."
      operationId: downLoadStopWords
      parameters:
      - description: "Language code (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          description: OK
      summary: Get Stopwords
      tags:
      - StopWords
      x-accepts: application/json
    put:
      description: "Upload a stopwords file for a language as a list of strings. This\
        \ should be a .txt file, not JSON."
      operationId: uploadStopWords
      parameters:
      - description: "Language code use by the site (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  type: string
                type: array
            text/json:
              schema:
                items:
                  type: string
                type: array
            text/plain:
              schema:
                items:
                  type: string
                type: array
          description: OK
      summary: Add Stopwords
      tags:
      - StopWords
      x-accepts: application/json
  /commerce/catalog/admin/searchSchema/suggest/settings/{language}:
    get:
      description: Gets the suggester settings for the site
      operationId: getSuggestSettings
      parameters:
      - description: "Language code use by the site (en, es, fr)"
        explode: false
        in: path
        name: language
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Suggester'
            text/json:
              schema:
                $ref: '#/components/schemas/Suggester'
            text/plain:
              schema:
                $ref: '#/components/schemas/Suggester'
          description: OK
      summary: Gets the suggester settings for the site
      tags:
