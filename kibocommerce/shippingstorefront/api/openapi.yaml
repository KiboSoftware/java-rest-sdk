openapi: 3.0.1
info:
  description: |-
    <div id="overview_SHIPPING">
                <h2>SHIPPING</h2>
                <p>The Shipping APIs are a collection of resources for administrating shipping settings such as carrier configurations and
                    shipping profiles. For more information about site settings and the associated configurations in the Unified Commerce Admin
                    interface, see the <a href="/pages/shipping-settings">Shipping Settings
                        documentation</a>.</p>
                <p>Use the <strong>Carrier Configuration</strong> (specific and global) resources to manage your settings for fulfillment carriers.</p>
                <p>Use the <strong>Carrier Credential</strong> and <strong>Credential Set</strong> resources to manage the authentication for your carrier configurations.</p>
                <p>Use the <strong>Shipping</strong> and <strong>Shipping Profile</strong> resources to set rules for shipping fees, profiles, and inclusion.</p>
                <p>Use the <strong>Target Rules</strong> resource to manage your target rules for products and zones. For example, you can set specific rules that dictate shipping options for specific products.</p>
            </div>
  title: Shipping Admin
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
