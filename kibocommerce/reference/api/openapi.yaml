openapi: 3.0.1
info:
  description: OpenAPI Spec for Kibo Reference Service
  title: Kibo Reference Service
  version: v1
servers:
- url: "https://{homePodHost}/api"
security:
- bearerAuth: []
paths:
  /platform/reference/addressschema/{countryCode}:
    get:
      description: Get Address Schema
      operationId: getAddressSchema
      parameters:
      - explode: false
        in: path
        name: countryCode
        required: true
        schema:
          default: US
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSchema'
            text/json:
              schema:
                $ref: '#/components/schemas/AddressSchema'
            text/plain:
              schema:
                $ref: '#/components/schemas/AddressSchema'
          description: OK
      summary: Get Address Schema
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/addressschemas:
    get:
      description: Get Address Schemas
      operationId: getAddressSchemas
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressSchemaCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/AddressSchemaCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/AddressSchemaCollection'
          description: OK
      summary: Get Address Schemas
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/behaviors:
    get:
      description: Retrieves a list of all behaviors.
      operationId: getBehaviors
      parameters:
      - explode: true
        in: query
        name: userType
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/BehaviorCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/BehaviorCollection'
          description: OK
      summary: Retrieves a list of all behaviors
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/behaviors/categories:
    get:
      description: Retrieves a list of all behavior categories.
      operationId: getBehaviorCategories
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCategoryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/BehaviorCategoryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/BehaviorCategoryCollection'
          description: OK
      summary: Retrieves a list of all behavior categories
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/behaviors/categories/{categoryId}:
    get:
      description: Retrieves the details of a behavior specified by its behavior ID.
      operationId: getBehaviorCategory
      parameters:
      - description: Unique identifier of the behavior category for which you want
          details.
        explode: false
        in: path
        name: categoryId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BehaviorCategory'
            text/json:
              schema:
                $ref: '#/components/schemas/BehaviorCategory'
            text/plain:
              schema:
                $ref: '#/components/schemas/BehaviorCategory'
          description: OK
      summary: Retrieves the details of a behavior specified by its behavior ID
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/behaviors/{behaviorId}:
    get:
      description: Retrieves the details of a behavior specified by its behavior ID.
      operationId: getBehavior
      parameters:
      - description: Unique identifier of the behavior for which you want details.
        explode: false
        in: path
        name: behaviorId
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Behavior'
            text/json:
              schema:
                $ref: '#/components/schemas/Behavior'
            text/plain:
              schema:
                $ref: '#/components/schemas/Behavior'
          description: OK
      summary: Retrieves the details of a behavior specified by its behavior ID
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/contentLocales:
    get:
      description: Get the full list of Content Locales supported by the system
      operationId: getContentLocales
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentLocaleCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/ContentLocaleCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/ContentLocaleCollection'
          description: OK
      summary: Get the full list of Content Locales supported by the system
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/countries:
    get:
      description: Get the full list of Countries supported by the system
      operationId: getCountries
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CountryCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CountryCollection'
          description: OK
      summary: Get the full list of Countries supported by the system
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/countries/{countryCode}/states:
    get:
      description: Get states/provinces for a country by ISO 3166-1 alpha-2 country
        code via ArcGIS Living Atlas.
      operationId: getStatesByCountry
      parameters:
      - description: "ISO 3166-1 alpha-2 country code (e.g. US, DE, GB)"
        explode: false
        in: path
        name: countryCode
        required: true
        schema:
          type: string
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StateCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/StateCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/StateCollection'
          description: OK
      summary: Get states/provinces for a country by ISO 3166-1 alpha-2 country code
        via ArcGIS Living Atlas
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/countrieswithstates:
    get:
      description: Get the full list of Countries supported by the system
      operationId: getCountriesWithStates
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CountryWithStatesCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CountryWithStatesCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CountryWithStatesCollection'
          description: OK
      summary: Get the full list of Countries supported by the system
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/currencies:
    get:
      description: Get the full list of Currencies supported by the system
      operationId: getCurrencies
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrencyCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/CurrencyCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/CurrencyCollection'
          description: OK
      summary: Get the full list of Currencies supported by the system
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/timezones:
    get:
      description: Get the full list of TimeZones supported by the system
      operationId: getTimeZones
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeZoneCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/TimeZoneCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/TimeZoneCollection'
          description: OK
      summary: Get the full list of TimeZones supported by the system
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/topleveldomains:
    get:
      description: Get a full list of the supported top level domains
      operationId: getTopLevelDomains
      parameters:
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopLevelDomainCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/TopLevelDomainCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/TopLevelDomainCollection'
          description: OK
      summary: Get a full list of the supported top level domains
      tags:
      - ReferenceData
      x-accepts: application/json
  /platform/reference/unitsofmeasure:
    get:
      description: Get a full list of the units of measure
      operationId: getUnitsOfMeasure
      parameters:
      - description: ""
        explode: true
        in: query
        name: filter
        required: false
        schema:
          type: string
        style: form
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasureCollection'
            text/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasureCollection'
            text/plain:
              schema:
                $ref: '#/components/schemas/UnitOfMeasureCollection'
          description: OK
      summary: Get a full list of the units of measure
      tags:
      - ReferenceData
      x-accepts: application/json
components:
  schemas:
    AddressSchema:
      example:
        countryLabel: countryLabel
        countryCode: countryCode
        id: 1
        fields:
        - data:
          - code: code
            value: value
          - code: code
            value: value
          id: 0
          label: label
          type: type
          order: 6
        - data:
          - code: code
            value: value
          - code: code
            value: value
          id: 0
          label: label
          type: type
          order: 6
      properties:
        countryCode:
          nullable: true
          type: string
        countryLabel:
          nullable: true
          type: string
        fields:
          items:
            $ref: '#/components/schemas/Field'
          nullable: true
          type: array
        id:
          format: int32
          type: integer
      type: object
    AddressSchemaCollection:
      example:
        totalCount: 0
        items:
        - countryLabel: countryLabel
          countryCode: countryCode
          id: 1
          fields:
          - data:
            - code: code
              value: value
            - code: code
              value: value
            id: 0
            label: label
            type: type
            order: 6
          - data:
            - code: code
              value: value
            - code: code
              value: value
            id: 0
            label: label
            type: type
            order: 6
        - countryLabel: countryLabel
          countryCode: countryCode
          id: 1
          fields:
          - data:
            - code: code
              value: value
            - code: code
              value: value
            id: 0
            label: label
            type: type
            order: 6
          - data:
            - code: code
              value: value
            - code: code
              value: value
            id: 0
            label: label
            type: type
            order: 6
      properties:
        items:
          items:
            $ref: '#/components/schemas/AddressSchema'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    Behavior:
      example:
        validUserTypes:
        - validUserTypes
        - validUserTypes
        name: name
        requiresBehaviorIds:
        - 1
        - 1
        systemRoles:
        - systemRoles
        - systemRoles
        oAuthScopes:
        - oAuthScopes
        - oAuthScopes
        id: 6
        isPrivate: true
        categoryId: 0
      properties:
        categoryId:
          format: int32
          type: integer
        id:
          format: int32
          type: integer
        isPrivate:
          type: boolean
        name:
          nullable: true
          type: string
        oAuthScopes:
          items:
            type: string
          nullable: true
          type: array
        requiresBehaviorIds:
          items:
            format: int32
            type: integer
          nullable: true
          type: array
        systemRoles:
          items:
            type: string
          nullable: true
          type: array
        validUserTypes:
          items:
            type: string
          nullable: true
          type: array
      type: object
    BehaviorCategory:
      example:
        name: name
        id: 0
      properties:
        id:
          format: int32
          type: integer
        name:
          nullable: true
          type: string
      type: object
    BehaviorCategoryCollection:
      allOf:
      - $ref: '#/components/schemas/BehaviorCategoryCollectionBase'
      - additionalProperties: false
        type: object
    BehaviorCategoryCollectionBase:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BehaviorCategory'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    BehaviorCollection:
      allOf:
      - $ref: '#/components/schemas/BehaviorCollectionBase'
      - additionalProperties: false
        type: object
    BehaviorCollectionBase:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Behavior'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    ContentLocale:
      example:
        code: code
        name: name
      properties:
        code:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    ContentLocaleCollection:
      example:
        totalCount: 0
        items:
        - code: code
          name: name
        - code: code
          name: name
      properties:
        items:
          items:
            $ref: '#/components/schemas/ContentLocale'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    Country:
      example:
        code: code
        name: name
      properties:
        code:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    CountryCollection:
      example:
        totalCount: 0
        items:
        - code: code
          name: name
        - code: code
          name: name
      properties:
        items:
          items:
            $ref: '#/components/schemas/Country'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    CountryWithStates:
      example:
        code: code
        states:
        - code: code
          name: name
          tags: tags
        - code: code
          name: name
          tags: tags
      properties:
        code:
          nullable: true
          type: string
        states:
          items:
            $ref: '#/components/schemas/ReferenceState'
          nullable: true
          type: array
      type: object
    CountryWithStatesCollection:
      example:
        totalCount: 0
        items:
        - code: code
          states:
          - code: code
            name: name
            tags: tags
          - code: code
            name: name
            tags: tags
        - code: code
          states:
          - code: code
            name: name
            tags: tags
          - code: code
            name: name
            tags: tags
      properties:
        items:
          items:
            $ref: '#/components/schemas/CountryWithStates'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    CurrencyCollection:
      example:
        totalCount: 0
        items:
        - code: code
          name: name
        - code: code
          name: name
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReferenceCurrency'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    Field:
      example:
        data:
        - code: code
          value: value
        - code: code
          value: value
        id: 0
        label: label
        type: type
        order: 6
      properties:
        data:
          items:
            $ref: '#/components/schemas/FieldData'
          nullable: true
          type: array
        id:
          format: int32
          type: integer
        label:
          nullable: true
          type: string
        order:
          format: int32
          type: integer
        type:
          nullable: true
          type: string
      type: object
    FieldData:
      example:
        code: code
        value: value
      properties:
        code:
          nullable: true
          type: string
        value:
          nullable: true
          type: string
      type: object
    ReferenceCurrency:
      example:
        code: code
        name: name
      properties:
        code:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
      type: object
    ReferenceState:
      example:
        code: code
        name: name
        tags: tags
      properties:
        code:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        tags:
          nullable: true
          type: string
      type: object
    ReferenceTimeZone:
      example:
        offset: 0.8008281904610115
        ianaCode: ianaCode
        id: id
        isDaylightSavingsTime: true
      properties:
        ianaCode:
          description: IANA Code valid for the Windows Code used as Id
          nullable: true
          type: string
        id:
          description: "The Id of the TimeZone (examples include: \"Central Standard\
            \ Time\", ...)"
          nullable: true
          type: string
        isDaylightSavingsTime:
          type: boolean
        offset:
          description: The current offset for this TimeZone in hours
          format: double
          type: number
      type: object
    StateCollection:
      example:
        countryCode: countryCode
        totalCount: 0
        items:
        - code: code
          name: name
          tags: tags
        - code: code
          name: name
          tags: tags
      properties:
        countryCode:
          nullable: true
          type: string
        items:
          items:
            $ref: '#/components/schemas/ReferenceState'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    TimeZoneCollection:
      example:
        totalCount: 6
        items:
        - offset: 0.8008281904610115
          ianaCode: ianaCode
          id: id
          isDaylightSavingsTime: true
        - offset: 0.8008281904610115
          ianaCode: ianaCode
          id: id
          isDaylightSavingsTime: true
      properties:
        items:
          items:
            $ref: '#/components/schemas/ReferenceTimeZone'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    TopLevelDomainCollection:
      example:
        totalCount: 0
        items:
        - items
        - items
      properties:
        items:
          items:
            type: string
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
    UnitOfMeasure:
      example:
        symbol: symbol
        pluralName: pluralName
        name: name
        unitOfMeasureType: unitOfMeasureType
      properties:
        name:
          nullable: true
          type: string
        pluralName:
          nullable: true
          type: string
        symbol:
          nullable: true
          type: string
        unitOfMeasureType:
          description: "This value can be \"Length\", \"Weight\", or \"Volume\""
          nullable: true
          type: string
      type: object
    UnitOfMeasureCollection:
      example:
        totalCount: 0
        items:
        - symbol: symbol
          pluralName: pluralName
          name: name
          unitOfMeasureType: unitOfMeasureType
        - symbol: symbol
          pluralName: pluralName
          name: name
          unitOfMeasureType: unitOfMeasureType
      properties:
        items:
          items:
            $ref: '#/components/schemas/UnitOfMeasure'
          nullable: true
          type: array
        totalCount:
          format: int32
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. \r\n\r\n Enter\
        \ 'Bearer' [space] and then your token in the text input below.\r\n\r\nExample:\
        \ \"Bearer 12345abcdef\""
      scheme: bearer
      type: http

