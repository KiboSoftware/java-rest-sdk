          nullable: true
          type: string
      type: object
    AdditionalNameInformation:
      description: Additional Name Information (N2) - Additional name information
      example:
        name: name
      properties:
        name:
          description: Name
          nullable: true
          type: string
      type: object
    AdministrativeCommunicationsContact:
      description: Administrative Communications Contact (PER) - Contact information
        (REUSABLE)
