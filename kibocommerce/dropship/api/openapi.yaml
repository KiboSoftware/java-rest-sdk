          nullable: true
          type: string
        purchaseOrderTypeCode:
          description: Purchase Order Type Code
          nullable: true
          type: string
        transactionSetPurposeCode:
          description: Transaction Set Purpose Code
          nullable: true
          type: string
      type: object
    CTP_Loop:
      description: |-
        CTP Loop - Pricing Information Loop
        Contains pricing information and related segments
      example:
        pricingInformation:
        - unitPrice: unitPrice
          priceIdentifierCode: priceIdentifierCode
          priceMultiplierQualifier: priceMultiplierQualifier
          multiplier5: multiplier5
