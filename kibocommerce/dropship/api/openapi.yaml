            CTP - Pricing Information
            To specify pricing information
          items:
            $ref: '#/components/schemas/PricingInformation'
          nullable: true
          type: array
      type: object
    CTT_Loop:
      description: |-
        CTT Loop - Transaction Totals Loop
        Contains transaction totals and related monetary information
      example:
        transactionTotals:
        - numberOfLineItems: numberOfLineItems
          unitOrBasisForMeasurementCode: unitOrBasisForMeasurementCode
          volume: volume
          hashTotal: hashTotal
          weight: weight
          unitOrBasisForMeasurementCode1: unitOrBasisForMeasurementCode1
        - numberOfLineItems: numberOfLineItems
          unitOrBasisForMeasurementCode: unitOrBasisForMeasurementCode
          volume: volume
          hashTotal: hashTotal
          weight: weight
          unitOrBasisForMeasurementCode1: unitOrBasisForMeasurementCode1
        monetaryAmountInformation:
        - amountQualifierCode: amountQualifierCode
          monetaryAmount: 0.8008281904610115
        - amountQualifierCode: amountQualifierCode
          monetaryAmount: 0.8008281904610115
      properties:
        monetaryAmountInformation:
          description: |-
            AMT - Monetary Amount Information
            To indicate the total monetary amount
          items:
            $ref: '#/components/schemas/MonetaryAmountInformation'
          nullable: true
          type: array
        transactionTotals:
          description: |-
            CTT - Transaction Totals
            To transmit a hash total for a specific element in the transaction set
          items:
            $ref: '#/components/schemas/TransactionTotals'
          nullable: true
          type: array
      type: object
    CarrierDetailsRoutingSequenceTransitTime:
      description: Carrier Details (Routing Sequence/Transit Time) (TD5) - Carrier
        and routing information (REUSABLE)
      example:
