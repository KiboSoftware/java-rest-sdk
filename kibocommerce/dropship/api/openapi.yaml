        communicationNumberQualifier1: communicationNumberQualifier1
        contactFunctionCode: contactFunctionCode
        communicationNumberQualifier2: communicationNumberQualifier2
        contactInquiryReference: contactInquiryReference
      properties:
        communicationNumber:
          description: Communication Number
          nullable: true
          type: string
        communicationNumber1:
          description: Communication Number 1
          nullable: true
          type: string
        communicationNumber2:
          description: Communication Number 2
          nullable: true
          type: string
        communicationNumberQualifier:
          description: Communication Number Qualifier
          nullable: true
          type: string
        communicationNumberQualifier1:
          description: Communication Number Qualifier 1
          nullable: true
          type: string
        communicationNumberQualifier2:
