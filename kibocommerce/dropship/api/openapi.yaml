        currencyCode:
          description: "Currency Code (e.g., USD, EUR, CAD)"
          nullable: true
          type: string
        entityIdentifierCode:
          description: Entity Identifier Code
          nullable: true
          type: string
      type: object
    DateTimeReference:
      description: Date/Time Reference (DTM) - Date and time information (REUSABLE)
      example:
        date: date
        time: time
        timeCode: timeCode
        dateTimeQualifier: dateTimeQualifier
      properties:
        date:
