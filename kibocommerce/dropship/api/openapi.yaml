openapi: 3.0.1
info:
  description: OpenAPI Spec for Kibo DropShip Service
  title: Kibo DropShip Service
  version: v1
servers:
- url: "https://{tenantPodHost}/api"
security:
- bearerAuth: []
paths:
  /commerce/dropship/invoice/{shipmentNumber}:
    get:
      description: Generates an EDI 810 Invoice for the specified shipment
      operationId: getDropShipInvoice
      parameters:
      - description: The shipment number to generate EDI 810 for
        explode: false
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionSet810'
          description: OK
      summary: Generates an EDI 810 Invoice for the specified shipment
      tags:
      - DropShip
      x-accepts: application/json
  /commerce/dropship/purchaseorder/{shipmentNumber}:
    get:
      description: "Generates an EDI 850 Purchase Order (returned as JSON) for the\
        \ specified shipment, resolving the vendor, contracted pricing, and ship-to\
        \ address from the shipment's fulfillment location. See the <a href=\"/developer-guides/dropship\"\
        >Dropship Developer Guide</a> for the complete segment mapping, validation\
        \ rules, and workflow."
      operationId: getDropShipPurchaseOrder
      parameters:
      - description: The shipment number to generate EDI 850 for
        explode: false
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSet'
            text/json:
              schema:
                $ref: '#/components/schemas/TransactionSet'
            text/plain:
              schema:
                $ref: '#/components/schemas/TransactionSet'
          description: OK
      summary: Retrieve EDI 850 Purchase Order
      tags:
      - DropShip
      x-accepts: application/json
  /commerce/dropship/translate/{shipmentNumber}:
    get:
      description: Translates a shipment into a lightweight response containing vendor
        SKU mappings and contracted pricing per item. See the <a href="/developer-guides/dropship">Dropship
        Developer Guide</a> for field details and behavior.
      operationId: translateDropshipShipment
      parameters:
      - description: The shipment number to translate
        explode: false
        in: path
        name: shipmentNumber
        required: true
        schema:
          format: int32
          type: integer
        style: simple
      - description: limits which fields are returned in the response body
        explode: true
        in: query
        name: responseFields
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
            text/json:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
            text/plain:
              schema:
                $ref: '#/components/schemas/TranslatedShipment'
          description: OK
      summary: Translate Shipment
      tags:
      - DropShip
      x-accepts: application/json
components:
