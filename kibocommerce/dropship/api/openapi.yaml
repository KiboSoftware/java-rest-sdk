    MonetaryAmountInformation:
      description: Monetary Amount Information (AMT) - Monetary amount information
        (REUSABLE)
      example:
        amountQualifierCode: amountQualifierCode
        monetaryAmount: 0.8008281904610115
      properties:
        amountQualifierCode:
          description: Amount Qualifier Code
          nullable: true
          type: string
        monetaryAmount:
          description: Monetary Amount
          format: double
          nullable: true
          type: number
      type: object
    N1_Loop:
      description: |-
        N1 Loop - Party Identification Loop
        Contains party information including identification, additional names, location, and geographic details
      example:
        referenceInformation:
        - referenceIdentification: referenceIdentification
          referenceIdentificationQualifier: referenceIdentificationQualifier
        - referenceIdentification: referenceIdentification
          referenceIdentificationQualifier: referenceIdentificationQualifier
        geographicLocation:
        - cityName: cityName
          locationQualifier: locationQualifier
          countryCode: countryCode
          postalCode: postalCode
          stateOrProvinceCode: stateOrProvinceCode
          locationIdentifier: locationIdentifier
        - cityName: cityName
          locationQualifier: locationQualifier
          countryCode: countryCode
          postalCode: postalCode
          stateOrProvinceCode: stateOrProvinceCode
          locationIdentifier: locationIdentifier
        additionalNameInformation:
        - name: name
        - name: name
        administrativeCommunicationsContact:
        - communicationNumberQualifier: communicationNumberQualifier
          communicationNumber1: communicationNumber1
          communicationNumber2: communicationNumber2
          name: name
          communicationNumber: communicationNumber
          communicationNumberQualifier1: communicationNumberQualifier1
          contactFunctionCode: contactFunctionCode
          communicationNumberQualifier2: communicationNumberQualifier2
          contactInquiryReference: contactInquiryReference
        - communicationNumberQualifier: communicationNumberQualifier
          communicationNumber1: communicationNumber1
          communicationNumber2: communicationNumber2
          name: name
          communicationNumber: communicationNumber
          communicationNumberQualifier1: communicationNumberQualifier1
          contactFunctionCode: contactFunctionCode
          communicationNumberQualifier2: communicationNumberQualifier2
          contactInquiryReference: contactInquiryReference
        partyLocation:
        - addressInformation: addressInformation
        - addressInformation: addressInformation
        partyIdentification:
        - identificationCode: identificationCode
          entityIdentifierCode: entityIdentifierCode
          identificationCodeQualifier: identificationCodeQualifier
          name: name
        - identificationCode: identificationCode
          entityIdentifierCode: entityIdentifierCode
          identificationCodeQualifier: identificationCodeQualifier
          name: name
      properties:
        additionalNameInformation:
          description: |-
            N2 - Additional Name Information
            To specify additional names or those longer than 35 characters in length
          items:
            $ref: '#/components/schemas/AdditionalNameInformation'
          nullable: true
          type: array
        administrativeCommunicationsContact:
          description: |-
            PER - Administrative Communications Contact
            To identify a person or office to whom administrative communications should be directed
          items:
            $ref: '#/components/schemas/AdministrativeCommunicationsContact'
          nullable: true
          type: array
        geographicLocation:
          description: |-
            N4 - Geographic Location
