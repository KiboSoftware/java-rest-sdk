        assignedIdentification: assignedIdentification
        productServiceIDQualifier2: productServiceIDQualifier2
        productServiceIDQualifier4: productServiceIDQualifier4
        productServiceIDQualifier3: productServiceIDQualifier3
        productServiceID2: productServiceID2
        productServiceID4: productServiceID4
        productServiceID3: productServiceID3
      properties:
