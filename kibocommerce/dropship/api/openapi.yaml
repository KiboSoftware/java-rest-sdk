          unitOrBasisForMeasurementCode1: unitOrBasisForMeasurementCode1
          unitOrBasisForMeasurementCode2: unitOrBasisForMeasurementCode2
          packagingCode: packagingCode
          unitOrBasisForMeasurementCode3: unitOrBasisForMeasurementCode3
          pack: pack
